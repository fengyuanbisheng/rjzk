<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href='data:application/manifest+json,{"name":"治疗执行小程序","short_name":"治疗执行","display":"standalone","background_color":"%230284c7","theme_color":"%230284c7","start_url":"./","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230284c7%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2756%27 text-anchor=%27middle%27 fill=%27%23fff%27%3E%E6%B2%BB%3C/text%3E%3C/svg%3E","sizes":"any","type":"image/svg+xml"}]}'>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0284c7">
<title>治疗执行小程序 - 专业版</title>
<style>
:root{--p:#0284c7;--pd:#0369a1;--pl:#e0f2fe;--n:#2563eb;--nl:#dbeafe;--pt:#7c3aed;--ptl:#ede9fe;--bg:#eaf4fd;--card:#fff;--tx:#16324f;--mu:#5f7d99;--bd:#d3e4f2;--dg:#dc2626;--wn:#f59e0b;--gd:#f5b301;--ok:#16a34a;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:radial-gradient(1000px 560px at 12% -8%,rgba(56,189,248,.22),transparent 60%),radial-gradient(800px 480px at 90% 8%,rgba(125,211,252,.16),transparent 55%),linear-gradient(160deg,#e6f3fd 0%,#eef8ff 45%,#f6fbff 100%);color:var(--tx);line-height:1.5;min-height:100vh}
.app-header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.app-header.nurse-mode{background:linear-gradient(135deg,var(--n),#14508a)}
.app-header.patient-mode{background:linear-gradient(135deg,var(--pt),#6d2f8a)}
.app-header.admin-mode{background:linear-gradient(135deg,#37474f,#263238)}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.app-header h1{font-size:1.1rem;font-weight:700}
.app-header .sub{font-size:.75rem;opacity:.9;margin-top:2px}
.h-acts{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.btn-back{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--p);border:1.5px solid var(--p);color:#fff;border-radius:999px;padding:11px 22px;font-size:.98rem;font-weight:700;cursor:pointer;min-height:44px;box-shadow:0 2px 8px rgba(0,0,0,.18);-webkit-tap-highlight-color:transparent;user-select:none}
.btn-back:active{transform:scale(.96)}
#btnLogout.btn-back{background:var(--pl);border-color:var(--bd);color:var(--pd);box-shadow:none}
.unit-input{display:flex;align-items:center;gap:6px}
.unit-input input{flex:1;min-width:0}
.unit-suffix{font-size:.9rem;color:var(--pd);white-space:nowrap;font-weight:600}
.mode-badge{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 10px;font-size:.75rem;cursor:pointer;white-space:nowrap}
.container{max-width:980px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:15px;margin-bottom:13px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card-title{font-size:1rem;font-weight:700;color:var(--pd);padding-bottom:9px;margin-bottom:11px;border-bottom:2px solid var(--pl);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.card-title .tag{font-size:.72rem;color:var(--mu);font-weight:400}
.field{margin-bottom:11px}
.field label{display:block;font-size:.84rem;color:var(--mu);margin-bottom:4px;font-weight:600}
.field label .req{color:var(--dg)}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=password],input[type=datetime-local],input[type=url],textarea,select{width:100%;padding:10px 11px;font-size:.95rem;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 2px rgba(2,132,199,.18)}
textarea{resize:vertical;min-height:56px}
.row{display:flex;gap:9px}
.row .field{flex:1}
.checkbox-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
@media(min-width:600px){.checkbox-grid{grid-template-columns:repeat(3,1fr)}}
.check-item{display:flex;align-items:center;gap:6px;padding:8px 9px;border:1px solid var(--bd);border-radius:8px;background:#f9fcff;cursor:pointer;font-size:.88rem;user-select:none}
.check-item input{width:19px;height:19px;accent-color:var(--p);flex-shrink:0}
.check-item.checked{border-color:var(--p);background:var(--pl)}
.radio-group{display:flex;flex-wrap:wrap;gap:7px}
.radio-item{display:flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid var(--bd);border-radius:8px;background:#f9fcff;cursor:pointer;font-size:.88rem;user-select:none}
.radio-item input{width:18px;height:18px;accent-color:var(--p)}
.radio-item.active{border-color:var(--p);background:var(--pl)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:9px;padding:12px 16px;font-size:.95rem;font-weight:600;cursor:pointer;min-height:46px;transition:opacity .15s,transform .05s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--p);color:#fff;width:100%}
.btn-wx{background:#07c160;color:#fff;width:100%;border:none}
.btn-wx:hover{filter:brightness(1.1)}
.code-item.on{background:rgba(52,168,83,.12)}
.code-item:focus{outline:2px solid var(--p)}
.btn-o{background:#fff;color:var(--p);border:1.5px solid var(--p)}
.btn-dg{background:#fff;color:var(--dg);border:1.5px solid var(--dg)}
.btn-n{background:var(--n);color:#fff}
.btn-pt{background:var(--pt);color:#fff}
.btn-gd{background:var(--gd);color:#fff}
.btn-ad{background:#455a64;color:#fff}
.btn-sm{min-height:36px;padding:6px 11px;font-size:.83rem;border-radius:8px}
.btn-block{width:100%}
.btn-group{display:flex;gap:9px;flex-wrap:wrap}
.btn-group .btn{flex:1}
.list-item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px;margin-bottom:11px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.lt-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:6px;flex-wrap:wrap}
.lt-no{font-weight:700;color:var(--pd);font-size:.92rem}
.lt-date{font-size:.76rem;color:var(--mu)}
.lt-name{font-size:1.05rem;font-weight:700}
.lt-info{font-size:.82rem;color:var(--mu);margin-top:3px}
.badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:.73rem;margin:2px 4px 2px 0;background:var(--pl);color:var(--pd)}
.badge.warn{background:#fdeee2;color:var(--wn)}
.badge.danger{background:#fbece9;color:var(--dg)}
.badge.info{background:var(--nl);color:var(--n)}
.badge.ok{background:#e8f5e9;color:var(--ok)}
.badge.gray{background:#eef1f0;color:var(--mu)}
.badge.gold{background:#fdf3d7;color:#8a6d00}
.badge.lv1{background:#e8f5e9;color:#2e7d32}
.badge.lv2{background:#e3f2fd;color:#1565c0}
.badge.lv3{background:#fdf3d7;color:#8a6d00}
.badge.blocked{background:#fbece9;color:var(--dg)}
.lt-acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.lt-acts .btn{flex:1 1 30%}
.empty{text-align:center;padding:44px 18px;color:var(--mu)}
.empty .icon{font-size:2.6rem;margin-bottom:8px;opacity:.5}
.stat-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stat{flex:1;min-width:88px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;text-align:center;position:relative;cursor:pointer}
.stat .num{font-size:1.3rem;font-weight:800;color:var(--p)}
.stat .lbl{font-size:.73rem;color:var(--mu)}
.stat .dot{position:absolute;top:5px;right:6px;background:var(--dg);color:#fff;border-radius:20px;font-size:.66rem;padding:1px 6px;font-weight:700}
.view-table{width:100%;border-collapse:collapse;font-size:.84rem}
.view-table th,.view-table td{border:1px solid var(--bd);padding:7px;text-align:left;vertical-align:top}
.view-table th{background:var(--pl);color:var(--pd);font-weight:700}
.view-table input,.view-table select{width:100%;padding:7px;font-size:.84rem;border:1px solid var(--bd);border-radius:6px}
.section-title{font-size:.94rem;font-weight:700;color:var(--pd);margin:13px 0 7px;padding-left:8px;border-left:4px solid var(--p)}
.toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:rgba(15,34,64,.93);color:#fff;padding:9px 18px;border-radius:20px;font-size:.88rem;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92%;text-align:center;box-shadow:0 4px 20px rgba(2,132,199,.22)}
.toast.show{opacity:1}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none;align-items:center;justify-content:center;padding:18px}
.modal-mask.show{display:flex}
.modal{background:#fff;border:1px solid #dce8f4;border-radius:14px;max-width:640px;width:100%;padding:18px;max-height:82vh;overflow-y:auto}
.modal h3{font-size:1.02rem;margin-bottom:7px}
.modal p{color:var(--mu);font-size:.88rem;margin-bottom:12px}
.modal .btn-group{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.modal .btn-group .btn{flex:1}
.modal-input{width:100%;padding:10px;font-size:.95rem;border:1px solid var(--bd);border-radius:8px;margin-bottom:10px}
.hidden{display:none!important}
.progress-wrap{display:flex;align-items:center;gap:9px;margin:7px 0}
.progress-bar{flex:1;height:13px;background:#e7eef4;border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--p),#06b6d4);border-radius:10px;transition:width .3s}
.progress-text{font-size:.82rem;font-weight:700;color:var(--pd);white-space:nowrap}
.stars{display:flex;gap:5px;font-size:1.7rem;justify-content:center;padding:6px 0}
.stars .star{cursor:pointer;color:#d8dee0;user-select:none;transition:color .1s}
.stars .star.on{color:var(--gd)}
.confirm-state{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:12px}
.cs-y{background:#e8f5e9;color:var(--ok)}
.cs-n{background:#fbece9;color:var(--dg)}
.remind-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:.88rem;flex-wrap:wrap}
.remind-item:last-child{border-bottom:none}
.appt-item{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:.87rem;flex-wrap:wrap}
.appt-item:last-child{border-bottom:none}
.appt-item .when{font-weight:700;color:var(--pd);min-width:145px}
/* ---- 登录页研究院背景 ---- */
body.login-page{background-color:#0a1426;background-repeat:no-repeat;background-position:center;background-size:cover;background-attachment:fixed;min-height:100vh}
body.login-page::before{content:"";position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(8,15,32,.5);z-index:0;pointer-events:none}
body.login-page>*{position:relative;z-index:1}
.login-wrap .field{position:relative}
.login-drop{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:40;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.22);max-height:230px;overflow:auto;display:none;text-align:left}
.login-drop .ld-item{padding:9px 11px;border-bottom:1px dashed var(--bd);cursor:pointer;font-size:.85rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.login-drop .ld-item:last-child{border-bottom:none}
.login-drop .ld-item.on,.login-drop .ld-item:hover{background:rgba(94,120,255,.09)}
.login-drop .ld-empty{padding:10px 12px;color:var(--wn);font-size:.82rem}
.login-wrap{max-width:420px;margin:26px auto 0;text-align:center}
.login-logo{width:74px;height:74px;border-radius:22px;margin:0 auto 14px;background:linear-gradient(135deg,var(--p),var(--n));display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.2rem}
.login-wrap h2{font-size:1.25rem;margin-bottom:5px}
.login-wrap .desc{color:var(--mu);font-size:.87rem;margin-bottom:22px}
.tab-bar{display:flex;gap:7px;overflow-x:auto;margin-bottom:13px;padding-bottom:3px}
.tab{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);font-size:.85rem;cursor:pointer;color:var(--mu)}
.tab.on{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.kpi .num{font-size:1.25rem;font-weight:800;color:var(--pd)}
.kpi .lbl{font-size:.73rem;color:var(--mu)}
.chart-box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;overflow-x:auto;text-align:center}
.sheet{font-family:"SimSun","Songti SC",serif;color:#000;font-size:11.5pt;background:#fff;padding:10px;border-radius:6px}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet th,.sheet td{border:1px solid #000;padding:4px 5px;text-align:center;vertical-align:middle;word-break:break-all}
.sheet .left{text-align:left}
.sheet-title{font-size:15pt;font-weight:700;letter-spacing:4px;text-align:center;margin:5px 0 2px}
.sheet .label{font-weight:700}
.sheet .hl{display:flex;justify-content:space-between;font-size:10.5pt;padding:2px 0}
.sheet h2{font-size:14pt;text-align:center;margin:8px 0}
@media print{
  body{background:#fff}
  .app-header,.btn,.toast,.modal-mask,.no-print,.tab-bar{display:none!important}
  .container{max-width:none;padding:0;margin:0}
  .card{box-shadow:none;border:none;padding:0;margin:0}
  .print-only{display:block!important}
  #printArea{position:absolute;left:0;top:0;width:210mm;min-height:297mm}
  .sheet{background:#fff;padding:0;border-radius:0}
  @page{size:A4;margin:10mm}
}
.print-only{display:none}
.wm-box{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;font-size:0}
.wm-line{position:absolute;white-space:nowrap;color:rgba(82,112,142,.13);font-size:13px;transform:rotate(-18deg);font-family:"Microsoft YaHei",sans-serif;letter-spacing:1px}
body{-webkit-user-select:none;-moz-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;-moz-user-select:text;user-select:text}
img{-webkit-touch-callout:none;pointer-events:auto}
@media print{.wm-box{display:none!important}}
input::placeholder,textarea::placeholder{color:#9db4c8}
/* ==================== 门户宣传与信息互通矩阵 UI（大版本） ==================== */
.container{padding-bottom:96px}
button.btn{border-radius:999px}
.card{box-shadow:0 2px 12px rgba(2,132,199,.09)}
.portal-hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 16px;color:#fff;background:linear-gradient(135deg,#0284c7,#0e7490 55%,#0d9488);margin-bottom:13px;box-shadow:0 6px 18px rgba(2,132,199,.25)}
.hero-wave{position:absolute;right:-20px;bottom:-34px;font-size:7rem;opacity:.14;transform:rotate(-12deg);pointer-events:none}
.portal-hero .ph-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.portal-ava{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:1.55rem;font-weight:800;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.35)}
.ph-name{font-size:1.06rem;font-weight:800}
.ph-sub{font-size:.8rem;opacity:.92;margin-top:2px}
.ph-mid{display:flex;align-items:center;gap:14px;margin-top:14px;position:relative;z-index:1}
.ring{position:relative;flex:none}
.ring svg{display:block}
.ring .ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.ring .ring-txt b{font-size:.95rem;line-height:1}
.ring .ring-txt span{font-size:.6rem;opacity:.9;margin-top:3px}
.ph-stats{flex:1;display:flex;gap:8px}
.ph-stat{flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 4px;text-align:center}
.ph-stat b{display:block;font-size:1.02rem;line-height:1.2}
.ph-stat span{font-size:.66rem;opacity:.92}
.portal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:13px}
.pg-cell{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 4px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(2,132,199,.06);transition:transform .08s}
.pg-cell:active{transform:scale(.96)}
.pg-cell .pg-ic{width:42px;height:42px;margin:0 auto 7px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff}
.ic-p{background:linear-gradient(135deg,#0284c7,#0369a1)}
.ic-g{background:linear-gradient(135deg,#0d9488,#0f766e)}
.ic-o{background:linear-gradient(135deg,#f59e0b,#d97706)}
.ic-v{background:linear-gradient(135deg,#7c3aed,#6d28d9)}
.ic-s{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.ic-r{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.pg-cell .pg-lb{font-size:.7rem;color:var(--tx)}
.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:calc(100% - 20px);max-width:540px;z-index:90;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:22px;box-shadow:0 8px 26px rgba(2,132,199,.18);display:flex;padding:7px;gap:4px}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:14px;color:var(--mu);font-size:.64rem;cursor:pointer;background:transparent;border:none;font-family:inherit}
.bn-item .bn-ic{font-size:1.22rem;line-height:1}
.bn-item.on{background:linear-gradient(135deg,rgba(2,132,199,.14),rgba(13,148,136,.12));color:var(--pd);font-weight:700}
.bn-badge{position:relative}
.bn-badge .red-dot{position:absolute;top:-4px;right:-8px;min-width:15px;height:15px;line-height:15px;padding:0 4px;border-radius:8px;background:var(--dg);color:#fff;font-size:.58rem;text-align:center}
.push-banner{display:flex;align-items:center;gap:9px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid #fed7aa;border-radius:14px;padding:10px 12px;margin-bottom:13px;cursor:pointer}
.push-banner .pb-ic{font-size:1.2rem}
.push-banner .pb-t{flex:1;font-size:.82rem;color:#9a3412}
.push-item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:11px;box-shadow:0 2px 8px rgba(2,132,199,.05)}
.push-item.unread{border-left:3px solid var(--dg)}
.push-meta{font-size:.72rem;color:var(--mu);margin-top:6px}
.content-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(2,132,199,.07)}
.cc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.cc-title{font-size:1rem;font-weight:700;color:var(--tx);flex:1;min-width:0}
.cc-cat{font-size:.66rem;color:#fff;background:linear-gradient(135deg,#0d9488,#0f766e);border-radius:8px;padding:2px 9px;white-space:nowrap}
.cc-sum{font-size:.82rem;color:var(--mu);line-height:1.55}
.cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:.72rem;color:var(--mu)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal-week{text-align:center;font-size:.66rem;color:var(--mu);padding:4px 0}
.cal-cell{position:relative;aspect-ratio:1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:.8rem;background:var(--bg);color:var(--mu);font-family:inherit}
.cal-cell.today{border:1.5px solid var(--wn);font-weight:800;color:var(--tx)}
.cal-cell.in{background:#e0f2fe;color:var(--pd)}
.cal-cell.done{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;font-weight:700}
.cal-cell.done::after{content:"✓";position:absolute;top:1px;right:4px;font-size:.58rem;color:#fff}
.cal-cell.off{opacity:.4}
.streak-bar{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.streak-dot{width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--bd)}
.streak-dot.on{background:linear-gradient(135deg,#0d9488,#0f766e);border:none}
.streak-dot.today{outline:2px solid var(--wn)}
.point-card{background:linear-gradient(135deg,#0e7490,#0d9488);border-radius:18px;color:#fff;padding:16px;margin-bottom:13px;box-shadow:0 6px 18px rgba(13,148,136,.3)}
.point-card .pc-num{font-size:2rem;font-weight:800;line-height:1}
.point-card .pc-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;font-size:.78rem;opacity:.95}
.point-item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--bd);font-size:.83rem}
.point-item .pv{font-weight:800;white-space:nowrap}
.pv-in{color:var(--ok)}
.pv-out{color:var(--dg)}
.mat-card{border:1px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:11px;background:var(--card)}
.mat-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.empty2{text-align:center;padding:38px 16px;color:var(--mu)}
.empty2 .e2-ic{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;background:linear-gradient(135deg,#e0f2fe,#ccfbf1);display:flex;align-items:center;justify-content:center;font-size:1.9rem}
.qr-box{text-align:center;padding:16px}
.qr-box img{border:1px solid var(--bd);border-radius:16px;background:#fff;padding:10px;width:210px;max-width:82%}
.qr-tip{font-size:.78rem;color:var(--mu);margin-top:10px;line-height:1.65}
.chip{display:inline-block;font-size:.66rem;padding:2px 9px;border-radius:999px;background:var(--pl);color:var(--pd);margin-left:6px}
.rule-row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.85rem}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.section-h .sh-t{font-weight:800;font-size:1rem;color:var(--tx)}
.backlink{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--p);border:1.5px solid var(--p);color:#fff;border-radius:999px;padding:11px 20px;font-size:.92rem;font-weight:700;cursor:pointer;margin-bottom:12px;min-height:46px;box-shadow:0 2px 10px rgba(2,132,199,.28);transition:opacity .15s,transform .05s}
.backlink:active{transform:scale(.97)}
/* 机构照片横幅 */
.org-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0e7490,#0d9488);border-radius:16px;padding:13px 15px;margin-bottom:12px;color:#fff;box-shadow:0 4px 14px rgba(13,148,136,.25)}
.org-logo-wrap{flex:0 0 auto;width:58px;height:58px;border-radius:14px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
.org-photo{width:100%;height:100%;object-fit:cover;display:block}
.org-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.52rem;color:#0f766e;text-align:center;line-height:1.25;padding:2px}
.org-placeholder .op-ic{font-size:1.45rem}
.org-name{font-size:1.02rem;font-weight:800;line-height:1.25}
.org-sub{font-size:.72rem;opacity:.92;margin-top:3px}
/* 分享邀请提示 */
.invite-tip{margin:8px 0 12px;padding:9px 12px;border-radius:12px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1.5px solid #fed7aa;color:#9a3412;font-size:.82rem;text-align:center}
@media(max-width:420px){.portal-grid{gap:7px}.pg-cell .pg-ic{width:36px;height:36px;font-size:1.12rem}.pg-cell .pg-lb{font-size:.64rem}}

/* ---- 营销三模块补充样式 ---- */
.progress-fill{min-width:3px}
.order-table input{margin:0}
.select-tag{margin-bottom:10px}

</style>

let bootState={phase:"idle",msg:"",issues:0,fixed:0};
function idbOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){idbErr="当前环境不支持 IndexedDB";rej(new Error(idbErr));return;}
    var req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=function(){var d=req.result;if(!d.objectStoreNames.contains(IDB_STORE))d.createObjectStore(IDB_STORE);if(!d.objectStoreNames.contains(IDB_SNAP))d.createObjectStore(IDB_SNAP);};
    req.onsuccess=function(){idbDB=req.result;idbReady=true;idbErr=null;res(idbDB);};
    req.onerror=function(){idbErr="IndexedDB 打开失败："+(req.error?req.error.message:"");rej(req.error||new Error(idbErr));};
    req.onblocked=function(){idbErr="IndexedDB 被占用（可能其他标签页正在使用）";rej(new Error(idbErr));};
  });
}
function idbTx(store,mode){if(!idbDB)throw new Error("IndexedDB 未就绪");return idbDB.transaction(store,mode).objectStore(store);}
function idbPut(key,val){return new Promise(function(res){if(!idbReady){res(false);return;}try{var tx=idbTx(IDB_STORE,"readwrite");tx.put(val,key);tx.oncomplete=function(){res(true);};tx.onerror=function(){res(false);};}catch(e){res(false);}});}
function idbGet(key){return new Promise(function(res){if(!idbReady){res(undefined);return;}try{var r=idbTx(IDB_STORE,"readonly").get(key);r.onsuccess=function(){res(r.result);};r.onerror=function(){res(undefined);};}catch(e){res(undefined);}});}
function idbSnapshotPut(snap){return new Promise(function(res){if(!idbReady){res(false);return;}try{var tx=idbTx(IDB_SNAP,"readwrite");tx.put(snap,snap.id);tx.oncomplete=function(){res(true);};tx.onerror=function(){res(false);};}catch(e){res(false);}});}
function idbSnapshotList(){return new Promise(function(res){if(!idbReady){res([]);return;}try{var r=idbTx(IDB_SNAP,"readonly").getAll();r.onsuccess=function(){res((r.result||[]).sort(function(a,b){var c=String(b.at||"").localeCompare(String(a.at||""));return c||String(b.id).localeCompare(String(a.id));}));};r.onerror=function(){res([]);};}catch(e){res([]);}});}
/* 统一读接口：优先采用 IndexedDB 中更新版本的数据（含版本号校验），否则回退当前内存/本地数据 */
function getDB(){
  return new Promise(function(res){
    if(!idbReady){res(DB);return;}
    idbGet("state").then(function(st){
      try{
        if(st&&st.data&&st.v&&st.v>(DB._v||0)){
          var parsed=JSON.parse(st.data);
          if(parsed&&typeof parsed==="object"){DB=parsed;migrate();}
        }
      }catch(e){}
      res(DB);
    }).catch(function(){res(DB);});
  });
}
/* 统一写接口：写 localStorage 同步兜底 + 写 IndexedDB（带版本号，供 getDB 比对） */
function saveDB(){
  return new Promise(function(res){
    try{localStorage.setItem(SK,JSON.stringify(DB));}catch(e){}
    if(!idbReady){res(false);return;}
    var v=(DB._v||0)+1;DB._v=v;
    var payload={v:v,at:nowStr(),data:JSON.stringify(DB)};
    idbPut("state",payload).then(function(ok){res(ok);});
  });
}
/* 高频写节流合并：登录计时/打卡等连续 save() 在 800ms 内合并为一次 IndexedDB 写入 */
function idbEnqueueSave(){
  if(saveQueueTimer)clearTimeout(saveQueueTimer);
  saveQueueTimer=setTimeout(function(){
    saveQueueTimer=null;
    saveDB();
    scheduleSnapshot();
  },800);
}
function scheduleSnapshot(){
  if(snapTimer)return;
  snapTimer=setTimeout(function(){snapTimer=null;takeSnapshot();},IDB_SNAPSHOT_INTERVAL);
}
function takeSnapshot(){
  return new Promise(function(res){
    if(!idbReady){res(false);return;}
    var snap={id:"snap_"+Date.now(),at:nowStr(),data:JSON.stringify(DB)};
    idbSnapshotPut(snap).then(function(){
      idbSnapshotList().then(function(list){
        for(var i=IDB_SNAPSHOT_KEEP;i<list.length;i++){
          try{var tx=idbTx(IDB_SNAP,"readwrite");tx.delete(list[i].id);}catch(e){}
        }
        res(true);
      }).catch(function(){res(true);});
    }).catch(function(){res(false);});
  });
}
/* ---------- 启动自检与自愈 ---------- */
function selfCheck(){
  var issues=[];
  if(typeof DB!=="object"||!DB){issues.push({lvl:"crit",code:"DB_NOT_OBJECT",msg:"数据根节点不是对象"});return issues;}
  DB_TABLES.forEach(function(t){if(t!=="settings"&&!Array.isArray(DB[t]))issues.push({lvl:"warn",code:"TBL_MISSING_"+t.toUpperCase(),msg:"缺少数据表 "+t});});
  if(!DB.settings||typeof DB.settings!=="object")issues.push({lvl:"crit",code:"SETTINGS_MISSING",msg:"设置对象缺失或损坏"});
  if(Array.isArray(DB.users)){
    if(!DB.users.some(function(u){return u&&u.username===DEF_ADMIN;}))issues.push({lvl:"warn",code:"NO_ADMIN",msg:"缺少默认管理员账号"});
    DB.users.forEach(function(u,i){if(!u||!u.username)issues.push({lvl:"warn",code:"USER_BAD",msg:"第"+(i+1)+"个账号缺少用户名"});});
  }
  if(Array.isArray(DB.patients)){
    DB.patients.forEach(function(p,i){
      if(!p||typeof p!=="object"){issues.push({lvl:"warn",code:"PAT_NOT_OBJ",msg:"患者第"+(i+1)+"项不是对象"});return;}
      if(!p.id)issues.push({lvl:"warn",code:"PAT_NO_ID",msg:"患者第"+(i+1)+"项缺少 id"});
      if(!p.no)issues.push({lvl:"warn",code:"PAT_NO_NO",msg:"患者第"+(i+1)+"项缺少编号"});
      if(!p.patient||typeof p.patient!=="object"||!p.patient.name)issues.push({lvl:"warn",code:"PAT_NO_NAME",msg:"患者第"+(i+1)+"项缺少姓名"});
      if(p.records&&!Array.isArray(p.records))issues.push({lvl:"warn",code:"PAT_REC_BAD",msg:"患者第"+(i+1)+"项治疗记录格式错误"});
      if(Array.isArray(p.records)&&p.records.length&&p.records.some(function(x){return !x||typeof x!=="object";}))issues.push({lvl:"warn",code:"PAT_REC_ITEM",msg:"患者第"+(i+1)+"项存在无效治疗记录"});
      if(!p.patient_evaluation||typeof p.patient_evaluation!=="object")issues.push({lvl:"warn",code:"PAT_EVAL_BAD",msg:"患者第"+(i+1)+"项评价数据缺失"});
    });
  }
  if(Array.isArray(DB.execEvals)){
    DB.execEvals.forEach(function(e,i){
      if(!e||!e.patientId)issues.push({lvl:"warn",code:"EVAL_NO_PAT",msg:"评价第"+(i+1)+"条缺少患者关联"});
      else if(Array.isArray(DB.patients)&&DB.patients.length&&!DB.patients.some(function(p){return p&&p.id===e.patientId;}))issues.push({lvl:"warn",code:"REF_EVAL_PATIENT",msg:"评价第"+(i+1)+"条引用的患者不存在"});
    });
  }
  if(Array.isArray(DB.users)&&Array.isArray(DB.patients)){
    DB.users.forEach(function(u){
      if(u&&u.role==="patient"&&u.patientId&&!DB.patients.some(function(p){return p&&p.id===u.patientId;}))issues.push({lvl:"warn",code:"REF_PATIENT_USER",msg:"患者账号 "+u.username+" 关联的档案不存在"});
    });
  }
  return issues;
}
function healLog(code,msg,action){if(!DB.settings)DB.settings={};DB.settings.selfHealLog=DB.settings.selfHealLog||[];DB.settings.selfHealLog.push({at:nowStr(),code:code,msg:msg,action:action||"自动修复"});}
function autoHeal(issues){
  var fixed=0;
  issues.forEach(function(it){
    if(it.code==="DB_NOT_OBJECT"){DB={};fixed++;}
    if(it.code==="SETTINGS_MISSING"||!DB.settings||typeof DB.settings!=="object"){DB.settings={syncUrl:"",syncKey:"",syncMethod:"jsonbin",syncAuto:false,passUpdated:false,deployUrl:"",deviceLock:false,smsProvider:"",wechatOAuth:false,wechatAppId:"",wechatSecret:"",wechatOAuthDesc:""};fixed++;}
    if(it.code.indexOf("TBL_MISSING_")===0){
      var t=it.code.slice(12).toLowerCase();
      if(t==="settings"){DB.settings={syncUrl:"",syncKey:"",syncMethod:"jsonbin",syncAuto:false,passUpdated:false,deployUrl:"",deviceLock:false,smsProvider:"",wechatOAuth:false,wechatAppId:"",wechatSecret:"",wechatOAuthDesc:""};}
      else DB[t]=[];
      fixed++;
    }
    if(it.code==="NO_ADMIN"){DB.users.unshift({username:DEF_ADMIN,password:DEF_ADMIN_PASS,role:"admin",displayName:"系统管理员",mustChange:true,scope:"all",createdAt:new Date().toLocaleDateString()});fixed++;}
    if(it.code==="USER_BAD"){DB.users=DB.users.filter(function(u){return u&&u.username;});healLog(it.code,it.msg,"过滤坏账号");fixed++;}
    if(it.code==="PAT_NOT_OBJ"){DB.patients=DB.patients.filter(function(p){return p&&typeof p==="object";});healLog(it.code,it.msg,"过滤坏患者项");fixed++;}
    if(it.code==="PAT_REC_ITEM"){DB.patients.forEach(function(p){if(p&&Array.isArray(p.records))p.records=p.records.filter(function(x){return x&&typeof x==="object";});});healLog(it.code,it.msg,"过滤坏治疗记录");fixed++;}
    if(it.code==="PAT_EVAL_BAD"){DB.patients.forEach(function(p){if(p&&(!p.patient_evaluation||typeof p.patient_evaluation!=="object"))p.patient_evaluation={result:"",summary:"",satisfaction:0,at:""};});healLog(it.code,it.msg,"补默认评价结构");fixed++;}
  });
  return fixed;
}
function resetToDefaults(){
  DB={users:[],patients:[],materials:[],execEvals:[],items:[],auditLog:[],loginLog:[],settings:{syncUrl:"",syncKey:"",syncMethod:"jsonbin",syncAuto:false,passUpdated:false,deployUrl:"",deviceLock:false,smsProvider:"",wechatOAuth:false,wechatAppId:"",wechatSecret:"",wechatOAuthDesc:""}};
  DB.users.push({username:DEF_ADMIN,password:DEF_ADMIN_PASS,role:"admin",displayName:"系统管理员",mustChange:true,scope:"all",createdAt:new Date().toLocaleDateString()});
  DB.users.push({username:"zhuli1",password:DEF_PASS,role:"executor",displayName:"默认执行人",mustChange:false,scope:"all",createdAt:new Date().toLocaleDateString()});
  DB.materials=MAT_PRESET.map(function(m,i){return {id:"m"+(i+1),category:m.c,name:m.n,spec:"常规",unit:m.u,stock:50};});
  DB.items=ITEM_PRESET.map(function(n,i){return {id:"t"+(i+1),name:n,diff:1};});
  migrate();
}
function rollbackSnapshot(snap){
  return new Promise(function(res){
    try{
      DB=JSON.parse(snap.data);migrate();
      healLog("ROLLBACK","严重损坏，回滚到快照 "+snap.id+"（"+snap.at+"）","回滚");
      saveDB();
      res(true);
    }catch(e){res(false);}
  });
}
function selfHealNow(){
  return new Promise(function(res){
    var issues=selfCheck();
    var crit=issues.filter(function(x){return x.lvl==="crit";});
    var result={issues:issues.length,fixed:0,rolled:false,restored:false};
    if(crit.length){
      idbSnapshotList().then(function(snaps){
        if(snaps.length){
          rollbackSnapshot(snaps[0]).then(function(ok){
            result.rolled=ok;
            if(ok)result.fixed++;
            try{migrate();}catch(e){}
            saveDB();
            res(result);
          });
        }else{
          result.restored=true;result.fixed++;
          resetToDefaults();
          healLog("RESET_DEFAULTS","无有效快照，重建默认数据结构","重建默认数据");
          saveDB();
          res(result);
        }
      }).catch(function(){
        result.restored=true;result.fixed++;
        resetToDefaults();
        saveDB();
        res(result);
      });
    }else{
      result.fixed=autoHeal(issues);
      try{migrate();}catch(e){}
      saveDB();
      res(result);
    }
  });
}
/* ---------- 初始化引导（启动自检 / 老数据迁移 / 损坏回滚 / 绝不白屏） ---------- */
function ensureBootBanner(){
  var b=document.getElementById("bootBanner");
  if(b)return b;
  b=document.createElement("div");
  b.id="bootBanner";
  b.style.cssText="position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99999;background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px 16px;font-size:.85rem;box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:92%;display:none";
  document.body.appendChild(b);
  return b;
}
function showBootBanner(done){
  var b=ensureBootBanner();
  if(!done){
    b.style.display="block";
    b.innerHTML='<span style="color:var(--mu,#666)">初始化数据引擎…</span>';
  }else{
    if(bootState.issues>0||bootState.fixed>0||bootState.rolled||bootState.restored){
      b.style.display="block";
      var extra=(bootState.rolled?"，已回滚到最近快照":"")+(bootState.restored?"，已重建默认数据":"");
      b.innerHTML='<span>启动自检完成：发现 '+bootState.issues+' 个问题，自动修复 '+bootState.fixed+' 项'+extra+'</span> <button class="btn btn-o btn-sm" onclick="showSelfCheckPanel()">查看详情</button>';
      setTimeout(function(){if(b)b.style.display="none";},12000);
    }else{
      b.style.display="none";
    }
  }
}
function initBootstrap(){
  bootState={phase:"starting",msg:"正在初始化数据引擎…",issues:0,fixed:0};
  try{showBootBanner(false);}catch(e){}
  idbOpen().then(function(){
    return idbGet("state").then(function(st){
      if(!st){return saveDB();}
      try{
        if(st.data&&st.v&&st.v>(DB._v||0)){
          var parsed=JSON.parse(st.data);
          if(parsed&&typeof parsed==="object"){DB=parsed;migrate();try{localStorage.setItem(SK,JSON.stringify(DB));}catch(e2){}}
        }
      }catch(e3){}
      return null;
    });
  }).then(function(){
    return selfHealNow();
  }).then(function(r){
    bootState={phase:"done",msg:"数据引擎就绪",issues:r.issues,fixed:r.fixed,rolled:r.rolled,restored:r.restored};
    if(r.rolled)bootState.msg="检测到数据损坏，已自动回滚到最近快照";
    if(r.restored)bootState.msg="检测到数据严重损坏且无快照，已重建默认数据";
    try{showBootBanner(true);}catch(e){}
    takeSnapshot();
  }).catch(function(){
    bootState={phase:"done",msg:"IndexedDB 不可用，已切换 localStorage 兼容模式",issues:0,fixed:0};
    try{showBootBanner(true);}catch(e){}
  });
}
/* ---------- 分页渲染辅助（大数据量列表防卡顿） ---------- */
function pagedList(arr,page){
  var all=arr||[];
  listTotal=all.length;
  var max=Math.max(1,Math.ceil(listTotal/PAGE_SIZE));
  var p=Math.min(Math.max(1,page||1),max);
  listPage=p;
  return {items:all.slice((p-1)*PAGE_SIZE,p*PAGE_SIZE),page:p,max:max,total:listTotal};
}
function pageBarHtml(page,max,total){
  if(max<=1)return "";
  var h='<div class="pager no-print" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0">'
    +'<button class="btn btn-o btn-sm" '+(page<=1?"disabled":"")+' onclick="listPageGo('+(page-1)+')">‹ 上一页</button>'
    +'<span style="font-size:.8rem;color:var(--mu)">第 '+page+'/'+max+' 页 · 共 '+total+' 条</span>'
    +'<button class="btn btn-o btn-sm" '+(page>=max?"disabled":"")+' onclick="listPageGo('+(page+1)+')">下一页 ›</button>'
    +'</div>';
  return h;
}
function listPageGo(p){
  listPage=p;
  if(view==="admin-home")renderAdminHome();
  else if(view==="admin-patients")renderAdminPatients();
  else if(view==="admin-summary")renderAdminSummary();
}
/* ---------- 管理员入口：数据自检与修复面板 ---------- */
function showSelfCheckPanel(){
  var logs=(DB.settings&&DB.settings.selfHealLog)||[];
  var last=(DB.settings&&DB.settings.selfCheckAt||"").slice(0,16);
  var h='<h3>数据自检与修复</h3>'
    +'<p style="font-size:.84rem;color:var(--mu)">检查数据完整性（schema、必填字段、引用关系）；异常自动修复，严重损坏自动回滚最近快照；无法恢复时可导出原始数据。</p>'
    +'<div style="font-size:.84rem;line-height:1.9">'
    +'<div>存储引擎：'+(idbReady?"IndexedDB（大数据模式）":"localStorage（兼容模式）"+(idbErr?" · "+esc(idbErr):""))+'</div>'
    +'<div>最近自检：'+(last||"尚未执行")+'</div>'
    +'<div>数据规模：患者 '+DB.patients.length+' 人 · 评价 '+DB.execEvals.length+' 条 · 治疗记录 '+DB.patients.reduce(function(s,p){return s+(p.records?p.records.length:0);},0)+' 条</div>'
    +'</div>'
    +(logs.length
      ?'<div style="font-size:.8rem;color:var(--mu);margin-top:8px">修复记录（最近 20 条）：</div><div style="font-size:.8rem;max-height:180px;overflow:auto">'+logs.slice(-20).reverse().map(function(l){return '<div style="padding:4px 0;border-bottom:1px dashed var(--bd)">'+esc(l.at)+' · '+esc(l.code)+' · '+esc(l.action||"自动修复")+'</div>';}).join("")+'</div>'
      :'<div style="font-size:.8rem;color:var(--mu);margin-top:8px">暂无修复记录</div>')
    +'<div class="btn-group" style="margin-top:12px">'
    +'<button class="btn btn-p" onclick="runSelfCheck(this)">立即自检并修复</button>'
    +'<button class="btn btn-n" onclick="showSnapshots()">快照回滚</button>'
    +'<button class="btn btn-o" onclick="exportData()">导出完整备份</button>'
    +'<button class="btn btn-o" onclick="importData()">导入恢复</button>'
    +'<button class="btn btn-dg" onclick="closeModal()">关闭</button>'
    +'</div>';
  showModal(h);
}
function runSelfCheck(btn){
  if(btn){btn.disabled=true;btn.textContent="自检中…";}
  selfHealNow().then(function(r){
    DB.settings.selfCheckAt=nowStr();
    try{save();}catch(e){}
    if(btn){btn.disabled=false;btn.textContent="立即自检并修复";}
    var msg="自检完成：发现 "+r.issues+" 个问题，修复 "+r.fixed+" 项"+(r.rolled?"（已回滚快照）":"")+(r.restored?"（已重建默认数据）":"");
    toast(msg);
    showSelfCheckPanel();
    if(r.rolled||r.restored){try{renderHome();}catch(e){}}
  });
}
function showSnapshots(){
  idbSnapshotList().then(function(list){
    var h='<h3>快照回滚</h3><p style="font-size:.84rem;color:var(--mu)">自动保留最近 '+IDB_SNAPSHOT_KEEP+' 份快照；严重损坏时可回滚到任意有效快照（回滚前请先导出当前数据）。</p>';
    if(!list.length)h+='<div style="color:var(--mu);font-size:.85rem">暂无快照（写入数据后自动生成）</div>';
    else h+=list.slice(0,IDB_SNAPSHOT_KEEP).map(function(s){
      var cnt=0;try{cnt=(JSON.parse(s.data||"{}").patients||[]).length;}catch(e){}
      return '<div class="rule-row">'+esc(s.at)+' · '+cnt+' 位患者 <button class="btn btn-o btn-sm" onclick="confirmRollback(\''+s.id+'\')">回滚到此快照</button></div>';
    }).join("");
    h+='<div class="btn-group" style="margin-top:12px"><button class="btn btn-o" onclick="showSelfCheckPanel()">返回</button></div>';
    showModal(h);
  });
}
function confirmRollback(sid){
  idbSnapshotList().then(function(list){
    var snap=null;
    list.forEach(function(s){if(s.id===sid)snap=s;});
    if(!snap){toast("快照不存在");return;}
    showModal('<h3>确认回滚</h3><p>将用快照 <b>'+esc(snap.at)+'</b> 覆盖当前数据，当前数据请先导出备份。此操作不可撤销。</p>'
      +'<div class="btn-group"><button class="btn btn-dg" onclick="doRollback(\''+sid+'\')">确认回滚</button><button class="btn btn-o" onclick="showSnapshots()">取消</button></div>');
  });
}
function doRollback(sid){
  idbSnapshotList().then(function(list){
    var snap=null;
    list.forEach(function(s){if(s.id===sid)snap=s;});
    if(!snap){toast("快照不存在");return;}
    rollbackSnapshot(snap).then(function(ok){
      if(ok){toast("已回滚到快照 "+snap.at);closeModal();try{renderHome();}catch(e){}}
      else toast("回滚失败");
    });
  });

function pyInitial(ch){
  if(!ch)return "";
  const c=ch.charAt(0), code=c.charCodeAt(0);
  if((code>=65&&code<=90)||(code>=97&&code<=122))return c.toLowerCase();
  const s=PY_MAP;
  for(const k in s){ if(s[k].indexOf(c)>=0)return k; }
  // 未收录生僻字回退：按 Unicode 段近似（常见字均已收录）
  if(code>=0x4E00&&code<=0x9FA5){
    if(code<0x554A)return "z"; // 极少数
    if(code<0x5E86)return "b";
    if(code<0x671F)return "p";
    if(code<0x70DF)return "q";
    if(code<0x795E)return "r";
    if(code<0x82AD)return "s";
    if(code<0x8BBA)return "t";
    return "y";
  }
  return "";
}
function pyCodeOf(str){
  if(!str)return "";
  let out="";
  for(let i=0;i<str.length;i++)out+=pyInitial(str.charAt(i));
  return out;
}

/* ==================== 分级管控（患者/项目难度 + 执行人等级授权） ==================== */
const LVL_NAMES={1:"一级",2:"二级",3:"三级"};
function lvlName(n){return LVL_NAMES[+n||1]||"一级";}
function execLevel(u){return Math.min(3,Math.max(1,+((u&&u.level)||1)));}
function patientLv(p){return Math.min(3,Math.max(1,+((p&&p.diffLevel)||1)));}
function itemLv(t){return Math.min(3,Math.max(1,+((t&&t.diff)||1)));}
function lvlBadge(n){n=Math.min(3,Math.max(1,+n||1));return '<span class="badge lv'+n+'">'+lvlName(n)+'</span>';}
function inScope(p){if(!cur||cur.role!=="executor")return false;return cur.scope==="all"||(Array.isArray(cur.scope)&&cur.scope.includes(p.id));}
function isAssigned(p){if(!cur||cur.role!=="executor")return false;return Array.isArray(cur.scope)&&cur.scope.includes(p.id);}
function execAuthReason(p){
  if(!cur)return "未登录";
  if(cur.role==="admin")return "";
  if(cur.role==="patient")return p.id===cur.patientId?"":"非本人档案";
  if(!inScope(p))return "您未被分配/指定该患者（不在您的可见范围）";
  if(isAssigned(p))return "";
  const lv=execLevel(cur),pl=patientLv(p);
  if(lv>=pl)return "";
  return "您的等级("+lvlName(lv)+")低于该患者难度("+lvlName(pl)+")";
}
function canAccessPatient(p){return execAuthReason(p)==="";}
function effLevelOf(p,items){let n=patientLv(p);(items||[]).forEach(it=>{const t=DB.items.find(x=>x.id===it.id);if(t)n=Math.max(n,itemLv(t));});return n;}

/* 管理员视角：指定执行人 u 对患者 p 的可执行判定 */
function execCanAccessBy(u,p){
  if(!u||u.role!=="executor")return {ok:true,why:"管理员不受限制"};
  const vis=u.scope==="all"||(Array.isArray(u.scope)&&u.scope.includes(p.id));
  if(!vis)return {ok:false,why:"未被分配/指定该患者（不在可见范围）"};
  if(Array.isArray(u.scope)&&u.scope.includes(p.id))return {ok:true,why:"已被管理员指定"};
  if(execLevel(u)>=patientLv(p))return {ok:true,why:"等级足够（"+lvlName(execLevel(u))+"≥患者难度"+lvlName(patientLv(p))+"）"};
  return {ok:false,why:"等级不足（"+lvlName(execLevel(u))+"<患者难度"+lvlName(patientLv(p))+"）"};
}
/* 项目级校验：执行人 u 可否对患者 p 执行项目 t */
function itemAuthFor(u,p,t){
  if(u&&u.role==="admin")return "";
  if(Array.isArray(u&&u.scope)&&u.scope.includes(p.id))return "";
  const need=Math.max(patientLv(p),itemLv(t)),lv=execLevel(u);
  if(lv>=need)return "";
  return "项目「"+t.name+"」难度"+lvlName(itemLv(t))+"，执行人等级("+lvlName(lv)+")低于本次治疗难度("+lvlName(need)+"，患者"+lvlName(patientLv(p))+")，禁止保存";
}

function doLogin(){
  const u=document.getElementById("lgUser").value.trim();

  if(!u){toast("请输入账号");return;}
  const byName=DB.users.find(x=>x.username.toLowerCase()===u.toLowerCase());
  if(byName){
    if(byName.role==="patient"&&!p){
      const pp=findP(byName.patientId);
      if(pp)return doPatientAutoLogin(pp);
    }
    if(!p){toast("请输入密码");return;}
    if(byName.password!==p){toast("用户名或密码错误");return;}
    if(byName.role==="patient"){
      const st=checkDeviceLock(byName);
      if(st){toast(st);return;}
      const pp=findP(byName.patientId);
      if(pp&&isWeChat())pp.bindWechat=byName.username;
      if(pp&&!pp.bindPhone)pp.bindPhone=pp.patient.phone||"";
      if(pp)bindInviteSource(pp);
    }
    doLoginFinish(byName,"密码");
    return;
  }
  const pat=findPatientByInput(u);
  if(pat){doPatientAutoLogin(pat);return;}
  toast("未找到匹配账号");
}
function findPatientByInput(q){
  const s=String(q||"").trim();if(!s)return null;
  const low=s.toLowerCase();
  let arr=DB.patients.filter(x=>!x.archived&&String(x.no||"").toLowerCase()===low);
  if(arr.length===1)return arr[0];
  arr=DB.patients.filter(x=>!x.archived&&(x.patient.phone===s||x.bindPhone===s));
  if(arr.length===1)return arr[0];
  const idc=s.toUpperCase();
  if(/^\d{17}[\dX]$/.test(idc)){
    arr=DB.patients.filter(x=>!x.archived&&(decId(x.patient.idCard)===idc||String(x.patient.idCard||"").toUpperCase()===idc));
    if(arr.length===1)return arr[0];
  }
  return null;
}

  const u=DB.users.find(x=>x.patientId===p.id);
  if(!u){toast("该档案无登录账号，请联系管理员");return;}

  const q=document.getElementById("lgUser").value.trim();
  if(q&&/^[0-9]{6,}$/.test(q)){if(!p.bindPhone)p.bindPhone=q;if(!p.patient.phone)p.patient.phone=q;p.bindName=p.patient.name;}
  if(p&&isWeChat())p.bindWechat=u.username;

  const nm=(p.patient.name||u.displayName||"");
  const dd=document.getElementById("lgDrop");if(dd)dd.style.display="none";

function fmtDur(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
function durText(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h>0?h+"小时":"")+m+"分"+s+"秒";}
function diffHms(startStr,endStr){const a=parseDT(startStr),b=parseDT(endStr);if(!a||!b)return "—";return fmtDur(Math.max(0,Math.floor((b-a)/1000)));}
function secFromDt(dtStr){const t=parseDT(dtStr);return t?Math.floor((Date.now()-t.getTime())/1000):-1;}
function nowInputVal(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");}
function markLoginStart(){if(cur&&cur.role==="executor"){cur.loginAt=nowStr();cur.patientStart="";}}
function shiftTick(){
  const el=document.getElementById("shiftTimer");
  if(el&&cur&&cur.role==="executor"&&cur.loginAt){const s=secFromDt(cur.loginAt);el.textContent=s<0?"—":durText(s);}
  const pt=document.getElementById("patientTimer");
  if(pt&&cur&&cur.role==="executor"&&cur.patientStart){const s=secFromDt(cur.patientStart);pt.textContent=s<0?"—":durText(s);}
}
function startShiftTimer(){if(shiftTimerInt)clearInterval(shiftTimerInt);shiftTimerInt=setInterval(shiftTick,1000);shiftTick();}
function stopShiftTimer(){if(shiftTimerInt){clearInterval(shiftTimerInt);shiftTimerInt=null;}}
function logout(){
  if(cur){
    if(cur.role==="executor"&&cur.loginAt){
      const dur=diffHms(cur.loginAt,nowStr());
      const lg=DB.loginLog||[];
      for(let k=lg.length-1;k>=0;k--){if(lg[k].username===cur.username&&lg[k].role==="executor"&&!lg[k].duration){lg[k].duration=dur;break;}}
      logOp("值班结束",cur.username+" 本次值班时长 "+dur);
    }
    logOp("退出登录",cur.username+" 登出");
  }
  stopShiftTimer(); cur=null; showLogin();
}

/* ==================== 提醒 ==================== */
function computeReminders(){
  const now=new Date(),tk=todayStr(),mk=addDays(now,1);
  const g={today:[],tomorrow:[],overdue:[]};
  visiblePatients().forEach(p=>{(p.appointments||[]).forEach(a=>{
    const dt=parseDT(a.dateTime); if(!dt)return;
    const it={id:a.id,pid:p.id,no:p.no,name:p.patient.name||"未命名",dateTime:a.dateTime,note:a.note,source:a.source,status:a.status,notified:!!a.notified};
    const k=dateKey(a.dateTime);
    if(k===tk)g.today.push(it);else if(k===mk)g.tomorrow.push(it);
    else if(dt.getTime()<now.getTime()&&a.status!=="done")g.overdue.push(it);
  });});
  const sf=(a,b)=>String(a.dateTime).localeCompare(String(b.dateTime));
  g.today.sort(sf);g.tomorrow.sort(sf);g.overdue.sort(sf);
  return g;
}
function reminderCount(){const g=computeReminders();return g.today.length+g.tomorrow.length+g.overdue.length;}
function ri(it){
  return '<div class="remind-item"><div style="flex:1;min-width:150px"><b>'+esc(it.no)+' '+esc(it.name)+'</b> · '+esc(it.dateTime)+(it.note?'<div style="font-size:.78rem;color:var(--mu)">备注：'+esc(it.note)+'</div>':'')+'</div>'
    +'<button class="btn btn-sm btn-o" onclick="markNotified(\''+it.id+'\',\''+it.pid+'\')">'+(it.notified?"已通知✓":"标记已通知")+'</button></div>';
}
function markNotified(aid,pid){
  const p=findP(pid);const a=(p.appointments||[]).find(x=>x.id===aid);
  if(a){a.notified=true;save();toast("已标记通知患者");renderHome();}
}
function checkRemindersOnOpen(){
  const g=computeReminders();const total=g.today.length+g.tomorrow.length+g.overdue.length;
  if(total===0)return;
  let h='<h3>治疗提醒</h3><p>以下患者需要安排或提醒治疗（仅当浏览器打开时有效，可在设置中授权系统通知）</p>';
  if(g.today.length)h+='<div class="section-title" style="color:var(--wn)">今日待治疗（'+g.today.length+'）</div>'+g.today.map(ri).join("");
  if(g.tomorrow.length)h+='<div class="section-title" style="color:var(--n)">明日待治疗（'+g.tomorrow.length+'）</div>'+g.tomorrow.map(ri).join("");
  if(g.overdue.length)h+='<div class="section-title" style="color:var(--dg)">已到期未治疗（'+g.overdue.length+'）</div>'+g.overdue.map(ri).join("");
  h+='<div class="btn-group"><button class="btn btn-p" onclick="closeModal();renderHome()">我知道了</button></div>';
  showModal(h);
}
function showReminderPanel(){
  const g=computeReminders();
  let h='<h3>提醒清单</h3><p>今日/明日待治疗及已到期未治疗患者</p>';
  h+='<div class="section-title" style="color:var(--wn)">今日（'+g.today.length+'）</div>'+(g.today.length?g.today.map(ri).join(""):'<div style="color:var(--mu);font-size:.83rem;padding:5px 0">无</div>');
  h+='<div class="section-title" style="color:var(--n)">明日（'+g.tomorrow.length+'）</div>'+(g.tomorrow.length?g.tomorrow.map(ri).join(""):'<div style="color:var(--mu);font-size:.83rem;padding:5px 0">无</div>');
  h+='<div class="section-title" style="color:var(--dg)">已到期未治疗（'+g.overdue.length+'）</div>'+(g.overdue.length?g.overdue.map(ri).join(""):'<div style="color:var(--mu);font-size:.83rem;padding:5px 0">无</div>');
  h+='<div class="btn-group"><button class="btn btn-o" onclick="closeModal()">关闭</button></div>';

function enableBrowserNotify(){
  if(!("Notification" in window)){toast("当前浏览器不支持系统通知");return;}
  if(Notification.permission==="granted"){toast("系统通知已开启");return;}
  Notification.requestPermission().then(p=>toast(p==="granted"?"系统通知已开启":"未获得通知权限"));
}
function startReminderTimer(){
  if(reminderTimer)clearInterval(reminderTimer);
  reminderTimer=setInterval(()=>{
    if(!cur||(!isAdmin()&&!isExecutor())||!("Notification" in window)||Notification.permission!=="granted")return;
    const now=Date.now();
    visiblePatients().forEach(p=>{(p.appointments||[]).forEach(a=>{
      if(a.notified)return;
      const dt=parseDT(a.dateTime);if(!dt)return;
      const gap=dt.getTime()-now;
      if(gap>=-60000&&gap<=10*60000){
        a.notified=true;
        try{new Notification("治疗提醒",{body:"患者 "+(p.patient.name||"")+"（"+p.no+"）预约："+a.dateTime+(a.note?"（"+a.note+"）":"")});}catch(e){}
      }
    });});
    save();
  },60000);
}

function nextNo(){let max=0;DB.patients.forEach(p=>{const m=/^ZY-?(\d+)$/.exec(String(p.no||""));if(m){const n=+m[1];if(n>max)max=n;}});return "ZY-"+String(max+1).padStart(4,"0");}
function togCheck(el){el.closest(".check-item").classList.toggle("checked",el.checked);}
function togRadio(el){const nm=el.name;document.querySelectorAll('input[name="'+nm+'"]').forEach(r=>r.closest(".radio-item").classList.toggle("active",r.checked));if(nm==="method"){const w=document.getElementById("f_methodOtherWrap");if(w)w.classList.toggle("hidden",el.value!=="other");}}
function savePatientForm(andPrint){

  r.plan.method=(document.querySelector('input[name="method"]:checked')||{}).value||"";

  r.plan.combined=document.getElementById("f_combined").value.trim();
  r.followup.revisitTime=document.getElementById("f_revisit").value;

  const pu=DB.users.find(u=>u.patientId===r.id);

function symText(p){const s=p.symptoms||{};const a=[];[["chronicBronchitis","慢性支气管炎"],["chronicUrticaria","慢性荨麻疹"],["bronchialAsthma","支气管哮喘"],["allergicDermatitis","过敏性皮肤病"],["lowImmunity","免疫力低下"],["gynecological","妇科炎症反复感染"],["hpv","HPV感染"]].forEach(pair=>{if(s[pair[0]])a.push(pair[1]);});if(s.other)a.push("其他："+s.other);return a.length?a.join("、"):"—";}
function planText(p){const m={immuneBalance:"免疫平衡治疗",acupointInjection:"免疫制剂穴位注射",acupuncture:"针灸治疗",other:p.plan.otherMethod||"其他"}[p.plan.method]||"—";return m+(p.plan.totalTimes?"（"+p.plan.totalTimes+"次/疗程，间隔"+(p.plan.intervalDays||0)+"天）":"");}
function clearRecord(pid,i){

function matQty(el,pid,ri,mi){const p=findP(pid);const x=p.records[ri];if(!x.consumables[mi]){x.consumables[mi]={id:"",name:"",unit:"",qty:0};}x.consumables[mi].qty=Math.max(0,+el.value||0);}
function saveExecForm(pid,ri,andPrint){
  const p=findP(pid);
  const x=p.records[ri];
  const time=x.time||nowStr();
  const timeSec=time;
  const execSel=document.getElementById("x_exec").value;
  if(!execSel){toast("请选择执行人");return;}
  const items=[];
  document.querySelectorAll("#x_itemsWrap input[data-it]:checked").forEach(cb=>{const t=DB.items.find(t=>t.id===cb.dataset.it);if(t)items.push({id:t.id,name:t.name,qty:1});});
  if(document.getElementById("x_customIt").checked){
    const cn=document.getElementById("x_customItName").value.trim();
    if(!cn){toast("请填写自定义项目名称");return;}
    items.push({id:"custom",name:cn,qty:1});
  }
  if(!items.length){toast("请至少选择一个治疗项目");return;}
  /* 分级管控：执行人授权与等级二次校验 */
  if(isExecutor()&&!canAccessPatient(p)){toast(execAuthReason(p));return;}
  const selU=DB.users.find(u=>u.username===execSel);
  if(selU&&selU.role==="executor"){
    const st=execCanAccessBy(selU,p);
    if(!st.ok){toast("所选执行人不可执行该患者："+st.why);return;}
  }
  for(const it of items){
    const t=DB.items.find(y=>y.id===it.id);
    if(!t||it.id==="custom")continue;
    const why=itemAuthFor(cur&&cur.role==="executor"?cur:(selU||cur),p,t);
    if(why){toast(why);return;}
  }
  x.effLevel=effLevelOf(p,items);
  /* 校验耗材库存 */
  const con=(x.consumables||[]).filter(c=>c&&c.id&&c.qty>0);
  for(const c of con){const m=DB.materials.find(y=>y.id===c.id);if(!m){toast("耗材不存在："+c.name);return;}if(c.qty>m.stock){toast("库存不足："+m.name+" 现有"+m.stock+m.unit+"，本次需要"+c.qty+m.unit);return;}}
  /* 扣减库存 */
  con.forEach(c=>{const m=DB.materials.find(y=>y.id===c.id);if(m)m.stock=Math.max(0,m.stock-c.qty);});
  x.time=timeSec;x.savedAt=nowStr();
  x.loginElapsed=diffHms(cur&&cur.role==="executor"?cur.loginAt:"",x.time);
  x.patientElapsed=diffHms(cur&&cur.role==="executor"?cur.patientStart:"",x.time);x.point=document.getElementById("x_point").value.trim();x.executorId=execSel;
  const eu=DB.users.find(u=>u.username===execSel);x.executor=eu?eu.displayName:execSel;
  x.medicine=document.getElementById("x_med").value.trim();
  x.qty=Math.max(0,+document.getElementById("x_qty").value||0);
  x.followup=document.getElementById("x_followup").value.trim();
  x.items=items;x.consumables=con;
  save();logOp("治疗执行录入",p.no+" "+p.patient.name+" 第"+(ri+1)+"次 @ "+timeSec);toast("第"+(ri+1)+"次治疗已保存，耗材已扣减");
  addCheckin(p.id); awardReferrer(p.id); settleReferral(p.id, items, ri);
  if(andPrint)printRecord(pid);else renderHome();
}

function submitConfirm(pid,idx){

function starInput(i,pre){let s="";for(let k=1;k<=5;k++)s+='<span class="star" data-'+(pre==="q"?"q":"c")+'="'+k+'" onclick="pickStar(this,'+i+',\''+pre+'\')">★</span>';return s;}
function pickStar(el,i,pre){
  const v=+el.dataset[pre==="q"?"q":"c"];
  const box=el.parentElement;
  box.querySelectorAll(".star").forEach(s=>{s.classList.toggle("on",+s.dataset[pre==="q"?"q":"c"]<=v);});
  box.dataset.val=v;
}
function submitEval(pid,idx){
  const p=findP(pid);
  const qBox=document.getElementById("stQ"+idx),cBox=document.getElementById("stC"+idx);
  const q=+(qBox.dataset.val||0),c=+(cBox.dataset.val||0);
  if(!q){toast("请选择服务质量评分");return;}
  if(!c){toast("请选择服务内容评分");return;}
  const items=[];
  document.querySelectorAll('#evItems'+idx+' input:checked').forEach(cb=>{const lbl=cb.closest(".check-item").textContent.trim();items.push({name:lbl.replace(/×\d+$/,""),qty:1});});
  if(!items.length){toast("请确认已执行项目");return;}
  const qty=Math.max(0,+document.getElementById("evqty"+idx).value||0);
  if(DB.execEvals.some(e=>e.patientId===pid&&e.recordIdx===idx)){toast("该次已评价，不可重复");return;}
  const x=p.records[idx];
  DB.execEvals.push({id:uid("e"),patientId:pid,recordIdx:idx,quality:q,content:c,items:items,qty:qty,comment:document.getElementById("evcmt"+idx).value.trim(),at:nowStr(),executorId:x.executorId,executor:x.executor});
  save();logOp("提交评价",p.no+" 第"+(idx+1)+"次评价 q="+q+" c="+c);toast("评价已提交，感谢您的反馈，时间已自动定格");addPoints(p.id,5,"完成治疗评价");renderPatientEval();
}

function doAddUser(role){

function defaultCycle(type){
  const d=new Date();
  if(type==="month")return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  if(type==="quarter")return d.getFullYear()+"-Q"+Math.floor(d.getMonth()/3+1);
  return String(d.getFullYear());
}
function renderWeekChart(){
  const box=document.getElementById("weekChartBox");if(!box)return;
  const un=document.getElementById("wk_user").value;
  const weeks=+document.getElementById("wk_n").value||12;
  const evs=DB.execEvals.filter(e=>e.executorId===un);
  const labels=[],Q=[],C=[];
  const now=new Date();
  for(let w=weeks-1;w>=0;w--){
    const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()+1-w*7);
    const sunday=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+6);
    labels.push(monday.getMonth()+1+"-"+(monday.getDate())+"周");
    const weekEvs=evs.filter(e=>{const t=parseDT(e.at);return t&&t>=monday&&t<=sunday;});
    Q.push(weekEvs.length?weekEvs.reduce((s,x)=>s+x.quality,0)/weekEvs.length:null);
    C.push(weekEvs.length?weekEvs.reduce((s,x)=>s+x.content,0)/weekEvs.length:null);
  }
  box.innerHTML=drawLineChart(labels,Q,C,"服务质量均分","服务内容均分",un);
}
function drawLineChart(labels,s1,s2,n1,n2,un){
  if(!labels.length)return "";
  const W=640,H=220,padL=36,padR=14,padT=16,padB=30;
  const all=[].concat(s1,s2).filter(x=>x!=null);
  const max=5,min=1;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const X=i=>padL+(labels.length===1?innerW/2:padL+ i*(innerW/(labels.length-1)));
  const Y=v=>padT+innerH-((v-min)/(max-min))*innerH;
  let pts1="",pts2="";
  s1.forEach((v,i)=>{if(v!=null)pts1+=(pts1?",":"")+X(i).toFixed(1)+","+Y(v).toFixed(1);});
  s2.forEach((v,i)=>{if(v!=null)pts2+=(pts2?",":"")+X(i).toFixed(1)+","+Y(v).toFixed(1);});
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="max-width:100%;height:auto;min-width:520px"><rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#f6fbff" stroke="#d6e4f0"/>';
  for(let v=1;v<=5;v++){const y=Y(v);svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#5f7d99" stroke-dasharray="3,3"/><text x="'+(padL-4)+'" y="'+(y+4)+'" font-size="10" fill="#6b7a76" text-anchor="end">'+v+'</text>';}
  for(let i=0;i<labels.length;i++){const x=X(i);svg+='<text x="'+x+'" y="'+(H-10)+'" font-size="9" fill="#6b7a76" text-anchor="middle">'+labels[i]+'</text>';}
  svg+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(H-padB)+'" stroke="#d6e4f0"/><line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="#d6e4f0"/>';
  if(pts1){svg+='<polyline points="'+pts1+'" fill="none" stroke="#0284c7" stroke-width="2.2"/><circle cx="'+X(s1.findIndex(v=>v!=null))+'" cy="'+Y(s1.find(v=>v!=null))+'" r="0"/>';s1.forEach((v,i)=>{if(v!=null)svg+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.4" fill="#0284c7"/>';});}
  if(pts2){svg+='<polyline points="'+pts2+'" fill="none" stroke="#f5b301" stroke-width="2.2"/>';s2.forEach((v,i)=>{if(v!=null)svg+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.4" fill="#f5b301"/>';});}
  svg+='<text x="'+padL+'" y="'+(padT-3)+'" font-size="10" fill="#0284c7">— '+n1+'</text><text x="'+(padL+70)+'" y="'+(padT-3)+'" font-size="10" fill="#8a6d00">— '+n2+'</text>';
  svg+='<text x="'+(W-padR)+'" y="'+(padT-3)+'" font-size="10" fill="#6b7a76" text-anchor="end">执行人：'+esc(un)+'</text>';
  svg+='</svg>';
  return svg;
}
function renderPerf(){
  const box=document.getElementById("perfBox");if(!box)return;
  const type=document.getElementById("pf_type").value;
  let cyc=document.getElementById("pf_cycle").value.trim();
  if(!cyc)cyc=defaultCycle(type);
  const [t0,t1]=cycleRange(type,cyc);
  const execs=executors().map(u=>{
    const evs=DB.execEvals.filter(e=>e.executorId===u.username&&inRange(e.at,t0,t1));
    const pids=new Set();
    DB.patients.forEach(p=>{p.records.forEach((x,i)=>{if(x.executorId===u.username&&x.time&&inRange(x.time,t0,t1)){pids.add(p.id);}});});
    let execCount=0,confirmed=0,totalQty=0;
    DB.patients.forEach(p=>{
      p.records.forEach((x,i)=>{
        if(x.executorId===u.username&&x.time&&inRange(x.time,t0,t1)){
          execCount+=1;
          const cf=p.execution_confirmations.find(c=>c.idx===i);
          if(cf)confirmed+=1;
          totalQty+=(+x.qty||0);
        }
      });
    });
    const avgScore=evs.length?(evs.reduce((s,e)=>s+e.quality+e.content,0)/(evs.length*2)):0;
    const confirmRate=execCount?confirmed/execCount:0;
    const matQty=DB.patients.reduce((s,p)=>s+p.records.reduce((ss,x)=>ss+(x.executorId===u.username&&x.time&&inRange(x.time,t0,t1)?(x.consumables||[]).reduce((sss,m)=>sss+(+m.qty||0),0):0),0),0);
    const score=Math.round((avgScore*5+Math.min(execCount,100)*0.2+confirmRate*5+Math.max(0,1-matQty/200)*1)*10)/10;
    return {u,evs:evs.length,execCount,confirmRate:Math.round(confirmRate*100),avgScore:Math.round(avgScore*10)/10,matQty,score};
  }).sort((a,b)=>b.score-a.score);
  let h='<table class="view-table"><tr><th>排名</th><th>执行人</th><th>评价均分<br>(质量+内容)</th><th>评价数</th><th>治疗执行数</th><th>患者确认率</th><th>耗材用量</th><th>综合得分</th></tr>';
  execs.forEach((r,i)=>{
    h+='<tr'+(i===0?' style="background:#fdf3d7"':'')+'><td><b>'+(i+1)+'</b></td><td>'+esc(r.u.displayName)+'</td><td>'+r.avgScore+'</td><td>'+r.evs+'</td><td>'+r.execCount+'</td><td>'+r.confirmRate+'%</td><td>'+r.matQty+'</td><td><b>'+r.score+'</b></td></tr>';
  });
  h+='</table>';
  h+='<p style="font-size:.78rem;color:var(--mu);margin-top:7px">周期：'+cyc+'（'+t0+' 至 '+t1+'）　综合得分=评价均分×5权重 + 执行量 + 确认率×5 + 耗材节省加分</p>';
  box.innerHTML=h;
}
function inRange(dtStr,t0,t1){const t=parseDT(dtStr);return t&&t>=t0&&t<=t1;}
function cycleRange(type,cyc){
  if(type==="month"){const m=/^(\d{4})-(\d{1,2})$/.exec(cyc);if(m){const y=+m[1],mo=+m[2];return [new Date(y,mo-1,1),new Date(y,mo,0,23,59,59)];}}
  if(type==="quarter"){const m=/^(\d{4})-?Q([1-4])$/i.exec(cyc);if(m){const y=+m[1],q=+m[2];return [new Date(y,(q-1)*3,1),new Date(y,q*3,0,23,59,59)];}}
  if(type==="year"){const m=/^(\d{4})$/.exec(cyc);if(m){const y=+m[1];return [new Date(y,0,1),new Date(y,11,31,23,59,59)];}}
  return [new Date(0),new Date(9999,11,31)];
}

function renderMatStats(){
  const box=document.getElementById("matStatsBox");if(!box)return;
  const from=document.getElementById("ms_from").value,t0=parseDT(from);
  const to=document.getElementById("ms_to").value,t1=parseDT(to);if(t1)t1.setHours(23,59,59);
  const mid=document.getElementById("ms_mat").value,uidF=document.getElementById("ms_exec").value;
  const agg={};
  DB.patients.forEach(p=>{p.records.forEach(x=>{
    if(!x.time)return;
    const t=parseDT(x.time);if(!t)return;
    if(t0&&t<t0)return;if(t1&&t>t1)return;
    if(uidF&&x.executorId!==uidF)return;
    (x.consumables||[]).forEach(c=>{
      if(mid&&c.id!==mid)return;
      const m=DB.materials.find(y=>y.id===c.id);
      const key=m?m.name:c.name;
      if(!agg[key])agg[key]={name:key,qty:0,count:0};
      agg[key].qty+=(+c.qty||0);agg[key].count+=1;
    });
  });});
  const rows=Object.values(agg).sort((a,b)=>b.qty-a.qty);
  let h='<table class="view-table"><tr><th>耗材</th><th>使用总量</th><th>使用次数</th></tr>';

}

function renderSummary(){
  const box=document.getElementById("summaryBox");if(!box)return;
  const from=document.getElementById("sm_from").value,t0=parseDT(from);
  const to=document.getElementById("sm_to").value,t1=parseDT(to);if(t1)t1.setHours(23,59,59);
  const uidF=document.getElementById("sm_exec").value,pidF=document.getElementById("sm_pat").value;
  let execCount=0,confirmed=0,execQty=0,matQty=0,evCount=0,evScoreSum=0;
  const byExec={},byMat={};
  DB.patients.forEach(p=>{
    if(pidF&&p.id!==pidF)return;
    p.records.forEach((x,i)=>{
      if(!x.time)return;
      const t=parseDT(x.time);if(!t)return;
      if(t0&&t<t0)return;if(t1&&t>t1)return;
      if(uidF&&x.executorId!==uidF)return;
      execCount+=1;execQty+=(+x.qty||0);
      const cf=p.execution_confirmations.find(c=>c.idx===i);
      if(cf)confirmed+=1;
      const eu=x.executorId||"未署名";
      byExec[eu]=byExec[eu]||{count:0,qty:0,confirmed:0};
      byExec[eu].count+=1;byExec[eu].qty+=(+x.qty||0);if(cf)byExec[eu].confirmed+=1;
      (x.consumables||[]).forEach(c=>{if(!c.id)return;const m=DB.materials.find(y=>y.id===c.id);const nm=m?m.name:c.name;matQty+=(+c.qty||0);byMat[nm]=byMat[nm]||{name:nm,qty:0};byMat[nm].qty+=(+c.qty||0);});
    });
  });
  DB.execEvals.forEach(e=>{
    const t=parseDT(e.at);if(!t)return;
    if(t0&&t<t0)return;if(t1&&t>t1)return;
    if(uidF&&e.executorId!==uidF)return;
    evCount+=1;evScoreSum+=e.quality+e.content;
  });
  const avg=evCount?Math.round(evScoreSum/evCount*10)/10:0;
  const rate=execCount?Math.round(confirmed/execCount*100):0;
  let h='<div class="kpi-grid">'
    +'<div class="kpi"><div class="num">'+execCount+'</div><div class="lbl">治疗执行次数</div></div>'
    +'<div class="kpi"><div class="num">'+execQty+'</div><div class="lbl">执行项目数量</div></div>'
    +'<div class="kpi"><div class="num">'+confirmed+'</div><div class="lbl">患者确认次数</div></div>'
    +'<div class="kpi"><div class="num">'+rate+'%</div><div class="lbl">确认率</div></div>'
    +'<div class="kpi"><div class="num">'+evCount+'</div><div class="lbl">评价条数</div></div>'
    +'<div class="kpi"><div class="num">'+avg+'</div><div class="lbl">评价均分(满分5)</div></div>'
    +'<div class="kpi"><div class="num">'+matQty+'</div><div class="lbl">耗材用量</div></div>'
    +'</div>';
  h+='<div class="section-title">按执行人汇总</div><table class="view-table"><tr><th>执行人</th><th>治疗次数</th><th>项目数量</th><th>确认次数</th></tr>';
  Object.keys(byExec).forEach(k=>{h+='<tr><td>'+esc(k)+'</td><td>'+byExec[k].count+'</td><td>'+byExec[k].qty+'</td><td>'+byExec[k].confirmed+'</td></tr>';});
  if(!Object.keys(byExec).length)h+='<tr><td colspan="4" style="text-align:center;color:var(--mu)">无记录</td></tr>';
  h+='</table>';
  h+='<div class="section-title">按耗材汇总</div><table class="view-table"><tr><th>耗材</th><th>用量</th></tr>';
  Object.keys(byMat).sort((a,b)=>byMat[b].qty-byMat[a].qty).forEach(k=>{h+='<tr><td>'+esc(k)+'</td><td>'+byMat[k].qty+'</td></tr>';});
  if(!Object.keys(byMat).length)h+='<tr><td colspan="2" style="text-align:center;color:var(--mu)">无记录</td></tr>';
  h+='</table>';
  box.innerHTML=h;
}

function saveSyncCfg(){
  DB.settings.syncMethod=document.getElementById("sy_method").value;
  DB.settings.syncUrl=document.getElementById("sy_url").value.trim();

  startSyncTimer();
}
function syncUpload(){
  const st=DB.settings;
  if(!st.syncUrl){toast("请先填写 API 地址/Bin ID");return;}
  const body={data:DB,savedAt:nowStr()};
  let url=st.syncUrl,method="PUT";
  if(st.syncMethod==="jsonbin"){
    const id=/[^/]+$/.exec(st.syncUrl.trim().replace(/\/+$/,""))[0];
    url="https://api.jsonbin.io/v3/b/"+id;
  }
  const opt={method:method,headers:{"Content-Type":"application/json"}};
  if(st.syncKey)opt.headers["X-Master-Key"]=st.syncKey;
  opt.body=JSON.stringify(body);
  fetch(url,opt).then(r=>{
    if(r.ok)toast("上传成功："+nowStr());
    else throw new Error("HTTP "+r.status);
  }).catch(e=>toast("上传失败："+e.message));
}
function syncDownload(){
  const st=DB.settings;
  if(!st.syncUrl){toast("请先填写 API 地址/Bin ID");return;}
  let url=st.syncUrl;
  if(st.syncMethod==="jsonbin"){
    const id=/[^/]+$/.exec(st.syncUrl.trim().replace(/\/+$/,""))[0];
    url="https://api.jsonbin.io/v3/b/"+id+"/latest";
  }
  const opt={method:"GET",headers:{}};
  if(st.syncKey)opt.headers["X-Master-Key"]=st.syncKey;
  fetch(url,opt).then(r=>{
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(j=>{
    const payload=j.record||j.data||j;
    if(!payload||!payload.data){toast("云端数据格式无效");return;}
    DB=payload.data;
    migrate();save();toast("下载成功，数据已合并到本地");renderHome();
  }).catch(e=>toast("下载失败："+e.message));
}
function startSyncTimer(){
  if(syncTimer)clearInterval(syncTimer);
  if(!DB.settings.syncAuto)return;
  syncTimer=setInterval(()=>{
    if(!DB.settings.syncAuto||!DB.settings.syncUrl)return;
    syncUpload();
  },10*60*1000);
}
function exportData(){
  takeSnapshot();
  const blob=new Blob([JSON.stringify({data:DB,engine:"idb",version:(DB._v||0),exportedAt:nowStr(),app:"治疗执行小程序"})],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="治疗执行小程序_数据备份_"+dateKey(nowStr())+".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出 JSON 备份文件");
}
function importData(){
  showModal('<h3>导入 JSON 数据</h3><p>选择之前导出的备份文件（.json），导入后将替换当前本地数据。请先导出当前数据以防丢失。</p>'
    +'<input type="file" accept=".json" id="impFile" class="modal-input">'
    +'<div class="btn-group"><button class="btn btn-p" onclick="doImport()">导入</button><button class="btn btn-o" onclick="closeModal()">取消</button></div>');
}
function doImport(){
  const f=document.getElementById("impFile").files[0];
  if(!f){toast("请选择文件");return;}
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);
      const payload=j.data||j;
      if(!payload||!payload.patients){toast("文件格式无效");return;}
      DB=payload;migrate();save();saveDB();toast("导入成功");
      closeModal();renderHome();
    }catch(e){toast("解析失败："+e.message);}
  };
  rd.readAsText(f);
}

function isWeChat(){return /MicroMessenger|Weixin/i.test(navigator.userAgent||"");}
function getDeviceFp(){
  try{
    let fp=localStorage.getItem("zzzy_device_fp");
    if(fp)return fp;
    const ua=(navigator.userAgent||"")+";"+(navigator.language||"")+";"+screen.width+"x"+screen.height+";"+(navigator.platform||"");
    fp="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,10)+ua.length;
    localStorage.setItem("zzzy_device_fp",fp);
    return fp;
  }catch(e){return "d"+Date.now().toString(36);}
}

function bindProtect(){
  const block=function(e){e.preventDefault();return false;};
  document.addEventListener("contextmenu",block,true);
  document.addEventListener("copy",block,true);
  document.addEventListener("cut",block,true);
  document.addEventListener("selectstart",function(e){
    const t=e.target;
    if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"))return;
    e.preventDefault();
  },true);
  document.addEventListener("dragstart",function(e){if(e.target&&e.target.tagName==="IMG"){e.preventDefault();return false;}},true);
  document.addEventListener("touchstart",function(e){
    if(e.target&&e.target.tagName==="IMG"&&e.touches&&e.touches.length>1)e.preventDefault();
  },{passive:false});
  document.querySelectorAll("img").forEach(function(im){im.setAttribute("draggable","false");im.style.pointerEvents="none";});
  refreshWm();
  setInterval(refreshWm,30000);
}
function checkDeviceLock(u){
  if(!DB.settings.deviceLock)return null;
  const fp=getDeviceFp();
  if(!u.deviceFp){u.deviceFp=fp;u.fpAt=nowStr();u.fpName=u.displayName;return null;}
  if(u.deviceFp===fp)return null;
  if(u.pendingFp===fp){return "检测到新设备登录，已提交管理员审批，请在管理员批准后重试（当前设备指纹："+fp+"）";}

  save();logOp("设备审批申请","账号 "+u.username+" 申请新设备："+fp);
  return "检测到新设备登录，已提交管理员审批。请等待管理员在「账号权限」页批准该设备后重试。";
}

function doQuickLogin(){
  const inp=document.getElementById("ql_inp").value.trim();
  const nm=document.getElementById("ql_name").value.trim();
  if(!inp){toast("请输入手机号或编号");return;}
  let u=DB.users.find(x=>x.username.toLowerCase()===inp.toLowerCase()&&x.role==="patient");
  let p=u?findP(u.patientId):null;
  if(!p)p=DB.patients.find(x=>x.patient.phone===inp||x.bindPhone===inp||x.no.toLowerCase()===inp.toLowerCase());
  if(!p){toast("未找到匹配档案。请先用账号（编号）+ 初始密码 123456 登录，或联系管理员核实手机号。");return;}
  u=u||DB.users.find(x=>x.patientId===p.id);
  if(!u){toast("该档案无登录账号，请联系管理员");return;}
  const pname=((findP(u.patientId).patient.name||u.displayName)||"").trim();
  if(nm&&nm!==pname){toast("姓名不匹配，请核对档案姓名");return;}
  const pp=findP(u.patientId);
  if(pp){
    if(inp.indexOf("@")<0&&/^[0-9]{6,}$/.test(inp)){if(!pp.bindPhone)pp.bindPhone=inp;if(!pp.patient.phone)pp.patient.phone=inp;pp.bindName=pname;}
    if(isWeChat())pp.bindWechat=u.username;
  }
  if(pp)bindInviteSource(pp);
  const st=checkDeviceLock(u);
  if(st){toast(st);return;}
  cur=u;markLoginStart();save();logLogin(u,"手机号快捷");
  toast("登录成功："+pname+"（手机号已绑定）");enterRoleHome();
}

function doForgotPass(){
  const inp=document.getElementById("fp_inp").value.trim();

function encId(s){if(!s)return "";const t=String(s).replace(/\s/g,"").toUpperCase();let r="";for(let i=0;i<t.length;i++)r+=String.fromCharCode(t.charCodeAt(i)^(17+(i%9)));try{return btoa(r);}catch(e){return "";}}
function decId(s){if(!s)return "";try{const t=atob(s);let r="";for(let i=0;i<t.length;i++)r+=String.fromCharCode(t.charCodeAt(i)^(17+(i%9)));return r;}catch(e){return "";}}
function execNameBy(userName){
  if(!userName)return "—";
  const u=DB.users.find(x=>x.username&&x.username.toLowerCase()===String(userName).toLowerCase());
  return u?(u.displayName||u.username):userName;
}
function maskId(s){
  const t=String(s||"").replace(/\s/g,"");
  if(t.length<=4)return t;
  return t.slice(0,4)+"********"+t.slice(-4);
}

function doIdCardLogin(){
  const idc=document.getElementById("ic_id").value.trim().toUpperCase();
  const nm=document.getElementById("ic_name").value.trim();
  const l4=document.getElementById("ic_last4").value.trim();
  if(!/^\d{17}[\dX]$/.test(idc)){toast("请填写正确的 18 位身份证号");return;}
  if(!nm&&!l4){toast("姓名与手机号后四位至少填写一项");return;}
  const byId=DB.patients.filter(p=>!p.archived&&decId(p.patient.idCard)===idc);
  let match=null;
  if(byId.length){
    match=byId.find(p=>nm&&(p.patient.name||"").trim()===nm)
      ||byId.find(p=>l4&&(p.patient.phone||p.bindPhone||"").slice(-4)===l4)
      ||(byId.length===1?byId[0]:null);
  }else if(l4){
    const phP=DB.patients.find(p=>!p.archived&&(p.patient.phone||p.bindPhone||"").slice(-4)===l4&&(!nm||(p.patient.name||"").trim()===nm));
    if(phP&&!phP.patient.idCard){phP.patient.idCard=encId(idc);match=phP;}
  }
  if(!match){toast("未匹配到档案：请核对身份证号与姓名/手机尾号；若档案未登记身份证号，请先用编号登录或联系管理员补充。");return;}
  const u=DB.users.find(x=>x.patientId===match.id);
  if(!u){toast("档案无登录账号，请联系管理员");return;}
  const st=checkDeviceLock(u);if(st){toast(st);return;}
  cur=u;markLoginStart();save();logLogin(u,"身份证识别");
  bindInviteSource(match);
  toast("识别成功，已自动登录："+(match.patient.name||u.displayName));
  closeModal();enterRoleHome();
}

  cur=u;markLoginStart();save();logLogin(u,"新患者注册");

function setupPWA(){

    const url=URL.createObjectURL(new Blob([SW_CODE],{type:"text/javascript"}));
    navigator.serviceWorker.register(url).catch(function(){try{navigator.serviceWorker.register("./sw.js").catch(function(){});}catch(e2){}});
  }catch(e){
    try{navigator.serviceWorker.register("./sw.js").catch(function(){});}catch(e2){}
  }
}

function ringHtml(pct,size,label){
  const r=size/2-5,c=2*Math.PI*r,off=c*(1-Math.min(100,Math.max(0,pct))/100);
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="5"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg><div class="ring-txt"><b>'+Math.round(pct)+'%</b><span>'+label+'</span></div></div>';
}
function qrImgUrl(data){

let qrTickInt=null;
let qrPulling=false;
function qrGuideToSync(){
  closeModal();
  if(cur&&(isAdmin()||isExecutor())){ renderSync(); return; }
  showModal('<h3>请先登录</h3><p style="font-size:.86rem;color:var(--mu)">配置云同步需要管理员账号登录。请先用 admin 登录，再进入「数据同步」页完成配置。</p><div class="btn-group"><button class="btn btn-p" onclick="closeModal()">知道了</button></div>');
}
function qrSyncPull(){
  const st=DB.settings;
  if(!st.syncUrl||qrPulling)return;
  qrPulling=true;
  let url=st.syncUrl;
  if(st.syncMethod==="jsonbin"){
    const m=/[^/]+$/.exec(String(st.syncUrl).trim().replace(/\/+$/,""));
    if(!m){qrPulling=false;return;}
    url="https://api.jsonbin.io/v3/b/"+m[0]+"/latest";
  }
  fetch(url,{method:"GET",headers:st.syncKey?{"X-Master-Key":st.syncKey}:{}})
    .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(j=>{const payload=j.record||j.data||j;if(payload&&payload.data){DB=payload.data;migrate();save();}qrPulling=false;})
    .catch(()=>{qrPulling=false;});
}
function qrTick(code){
  qrSyncPull();
  const item=(DB.loginCodes||[]).find(x=>x.code===code);
  if(!item){if(qrTickInt){clearInterval(qrTickInt);qrTickInt=null;}return;}
  if(item.used&&item.user){
    if(qrTickInt){clearInterval(qrTickInt);qrTickInt=null;}
    const u=DB.users.find(y=>y.username===item.user);
    if(!u){toast("授权账号不存在");closeModal();return;}
    cur=u; markLoginStart(); logLogin(u,"扫码授权");
    closeModal(); toast("扫码授权成功，欢迎回来 "+(u.displayName||u.username));
    enterRoleHome();
  }
}
function authQrCode(code){
  if(!code)return false;
  const item=(DB.loginCodes||[]).find(x=>x.code===code&&!x.used);
  if(!item)return false;
  item.user=cur?cur.username:""; item.used=true; item.authedAt=nowStr();
  save();
  if(DB.settings&&DB.settings.syncUrl)syncUpload();
  toast("已在手机端授权登录，请回到电脑查看");
  return true;
}
function applyQrAuth(){
  try{
    const m=(location.search||location.hash).match(/qr=([A-Za-z0-9_\-]+)/);
    if(m&&m[1])authQrCode(m[1]);
  }catch(e){}
}
