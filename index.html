/* ---------- 打卡营销 ---------- */
function dateKeyStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayKey(){return dateKeyStr(new Date());}
function addCheckin(pid){
  const rule=DB.settings.checkinRule||{enable:true,reward:1,streakBonus:true,streakDays:7,streakReward:10};
  if(rule.enable===false)return;
  const k=todayKey();
  const p=DB.patients.find(x=>x.id===pid);if(!p)return;
  const had=(DB.checkins||[]).some(c=>c.pid===pid&&c.date===k);
  DB.checkins=DB.checkins||[];
  if(!had){DB.checkins.push({id:uid("ck"),pid:pid,date:k,at:nowStr()});addPoints(pid,rule.reward||1,"当日治疗打卡");}
}
function streakInfo(pid){
  const cs=(DB.checkins||[]).filter(c=>c.pid===pid).map(c=>c.date).sort();
  const set=new Set(cs);
  let streak=0,d=new Date();
  if(set.has(dateKeyStr(d))){streak=1;d.setDate(d.getDate()-1);while(set.has(dateKeyStr(d))){streak++;d.setDate(d.getDate()-1);}}
  return streak;
}
function renderCheckin(){
  const p=DB.patients.find(x=>x.id===cur.patientId);
  view="patient-checkin";
  setHeader("患者端 · 疗程打卡","坚持治疗 · 连续打卡得积分","patient");
  const rule=DB.settings.checkinRule||{enable:true,reward:1,streakBonus:true,streakDays:7,streakReward:10};
  const streak=streakInfo(p.id);
  const total=(DB.checkins||[]).filter(c=>c.pid===p.id).length;
  let h=patientTop()+'<div class="card"><div class="card-title">本月打卡日历</div>'+calGridHtml(p)+'</div>';
  h+='<div class="point-card" style="background:linear-gradient(135deg,#f59e0b,#d97706)"><div class="pc-num">'+streak+' 天</div><div class="pc-row"><span>当前连续打卡</span><span>累计 '+total+' 次</span></div></div>';
  h+='<div class="card"><div class="card-title">打卡规则</div>'

function calGridHtml(p){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
  const startOff=first.getDay();
  const cks=new Set((DB.checkins||[]).filter(c=>c.pid===p.id).map(c=>c.date));
  const plan=p.plan||{};
  let planDays=[];
  try{const sd=new Date(plan.startDate||""),ed=new Date(plan.endDate||"");if(!isNaN(sd)&&!isNaN(ed)){for(let d=new Date(sd);d<=ed;d.setDate(d.getDate()+1))planDays.push(dateKeyStr(d));}}catch(e){}
  let h='<div class="cal-grid"><div class="cal-week">日</div><div class="cal-week">一</div><div class="cal-week">二</div><div class="cal-week">三</div><div class="cal-week">四</div><div class="cal-week">五</div><div class="cal-week">六</div>';
  for(let i=0;i<startOff;i++)h+='<div class="cal-cell off"></div>';
  for(let d=1;d<=days;d++){
    const dk=dateKeyStr(new Date(y,m,d));
    const cls=["cal-cell"];
    if(dk===todayKey())cls.push("today");
    if(planDays.includes(dk))cls.push("in");
    if(cks.has(dk))cls.push("done");
    h+='<div class="'+cls.join(" ")+'">'+d+'</div>';
  }
  h+='</div><div class="streak-bar">'+(planDays.length?'疗程区间 '+planDays.length+' 天':'')+'</div>';
  return h;
}

/* ==================== 营销三模块：优惠券 / 会员等级 / 转介绍奖励结算 ==================== */
function mktLevels(){return [{k:1,name:"普通",threshold:0,discount:100,benefit:"基础服务，标准收费",icon:"🟢"},{k:2,name:"白银",threshold:2000,discount:98,benefit:"治疗费 98 折 · 生日礼遇",icon:"🥈"},{k:3,name:"黄金",threshold:5000,discount:95,benefit:"治疗费 95 折 · 优先预约",icon:"🥇"},{k:4,name:"钻石",threshold:10000,discount:90,benefit:"治疗费 9 折 · 专属客服 · 免费评估",icon:"💎"}];}
function memberRule(){if(!DB.settings.memberRule||!Array.isArray(DB.settings.memberRule.levels)||!DB.settings.memberRule.levels.length){DB.settings.memberRule={levels:mktLevels()};}return DB.settings.memberRule;}
function rewardRule(){const rr=DB.settings.rewardRule||{};return {mode:rr.mode==="coupon"?"coupon":"points",val:Math.max(0,+rr.val||(+((DB.settings.referralRule||{}).reward||20))||20),couponAmount:Math.max(1,+rr.couponAmount||10),couponDays:Math.max(1,+rr.couponDays||30),note:rr.note||""};}
function levelList(){return memberRule().levels;}
function levelBySpent(spent){let k=1;levelList().forEach(l=>{if(+spent>=(+l.threshold||0)&&(+l.k||0)>k)k=+l.k;});return k;}
function patientLevel(p){if(!p)return 1;if(+p.manualLevel>0)return +p.manualLevel;return levelBySpent(p.totalSpent||0);}
function levelObj(p){const k=patientLevel(p);return levelList().find(l=>+l.k===k)||{k:1,name:"普通",threshold:0,discount:100,benefit:"",icon:"🟢"};}
function nextLevelObj(p){const k=patientLevel(p);return levelList().find(l=>+l.k===k+1)||null;}
function levelDiscount(p){return (+levelObj(p).discount||100)/100;}
function coupons(){DB.coupons=Array.isArray(DB.coupons)?DB.coupons:[];return DB.coupons;}
function userCoupons(){DB.userCoupons=Array.isArray(DB.userCoupons)?DB.userCoupons:[];return DB.userCoupons;}
function rewardSettles(){DB.rewardSettles=Array.isArray(DB.rewardSettles)?DB.rewardSettles:[];return DB.rewardSettles;}
function memberLogs(){DB.memberLogs=Array.isArray(DB.memberLogs)?DB.memberLogs:[];return DB.memberLogs;}
function orders(){DB.orders=Array.isArray(DB.orders)?DB.orders:[];return DB.orders;}
function couponStatusText(c){if(!c)return "";if(c.status==="paused")return "已停用";if(c.status==="deleted")return "已删除";const n=todayKey();if(c.startDate&&c.endDate&&(n<c.startDate||n>c.endDate))return "已过期";return "发放中";}
function couponActive(c){return couponStatusText(c)==="发放中";}
function couponTypeText(c){return c.type==="discount"?"折扣":"满减";}
function couponScopeText(c){const sc=[];if(c.itemIds&&c.itemIds.length){sc.push("限项目："+c.itemIds.map(id=>{const it=DB.items.find(x=>x.id===id);return it?it.name:"?";}).join("、")+"）");}if(c.diffLevel&&+c.diffLevel>0){sc.push("限难度≤"+c.diffLevel);}if(!sc.length)sc.push("全项目可用");return "("+sc.join("；")+")";}
function couponUsableFor(c,p){if(!c||!couponActive(c))return false;if(c.itemIds&&c.itemIds.length){const pids=new Set((p.plan&&p.plan.items||[]).map(i=>i&&i.id));if(!c.itemIds.some(id=>pids.has(id)))return false;}if(c.diffLevel&&+c.diffLevel>0){if((+p.diffLevel||1)>(+c.diffLevel))return false;}return true;}
function couponStatOf(c){const ucs=userCoupons().filter(x=>x.couponId===c.id);return {total:ucs.length,receive:ucs.filter(x=>x.src==="receive").length,used:ucs.filter(x=>x.status==="used").length};}
function myCoupons(p){return userCoupons().filter(x=>x.owner===p.id||x.owner===cur.username).sort((a,b)=>String(b.receiveAt).localeCompare(String(a.receiveAt)));}
function ucStatusText(uc){const c=coupons().find(x=>x.id===uc.couponId);if(!c)return "已失效";if(uc.status==="used")return "已使用";if(!couponActive(c))return "已失效";return "可使用";}
function calCouponSave(c,p,total){if(!c||!couponActive(c)||!total)return 0;if(c.type==="reduce"){if((+c.threshold||0)>0&&total<+c.threshold)return 0;return Math.min(total,+c.amount||0);}const d=Math.min(10,Math.max(0.1,(+c.discount||10)));return Math.round(total*(1-d/10)*100)/100;}
function usableCouponsFor(p){return myCoupons(p).filter(uc=>uc.status==="unused").map(uc=>({uc:uc,c:coupons().find(x=>x.id===uc.couponId)})).filter(o=>o.c&&couponUsableFor(o.c,p));}

function calcOrder(p){
  const items=DB.items||[];
  let original=0;const lines=[];
  items.forEach(it=>{const qty=Math.max(0,parseInt(document.getElementById("od_qty_"+it.id).value,10)||0);const price=Math.max(0,parseFloat(document.getElementById("od_price_"+it.id).value)||0);if(qty>0){lines.push({id:it.id,name:it.name,diff:it.diff||1,price:price,qty:qty});original+=price*qty;}});
  const memberRate=levelDiscount(p);
  const memberSave=Math.round((original-original*memberRate)*100)/100;
  const afterMember=Math.round((original*memberRate)*100)/100;
  const couponEl=document.getElementById("od_coupon");
  const uc=couponEl&&couponEl.value?userCoupons().find(x=>x.id===couponEl.value):null;
  const c=uc?coupons().find(x=>x.id===uc.couponId):null;
  let couponSave=0;
  if(c){if(c.type==="reduce"){if((+c.threshold||0)>0&&afterMember<+c.threshold)couponSave=0;else couponSave=Math.min(afterMember,+c.amount||0);}else{const d=Math.min(10,Math.max(0.1,(+c.discount||10)));couponSave=Math.round(afterMember*(1-d/10)*100)/100;}}
  const pay=Math.max(0,Math.round((afterMember-couponSave)*100)/100);
  return {original:original,memberRate:memberRate,memberSave:memberSave,afterMember:afterMember,coupon:uc?uc:null,couponObj:c,couponSave:couponSave,pay:pay,lines:lines};
}

function placeOrder(){
  const p=DB.patients.find(x=>x.id===cur.patientId);if(!p){toast("请先登录患者账号");return;}
  const o=calcOrder(p);
  if(!o.lines.length){toast("请至少选择一个项目并填写数量");return;}
  if(o.pay<=0){toast("结算金额为 0，无需下单");return;}
  const order={id:uid("od"),pid:p.id,patientNo:p.no,patientName:p.patient.name||p.no,at:nowStr(),lines:o.lines,original:o.original,memberRate:o.memberRate,memberSave:o.memberSave,couponId:o.coupon?o.coupon.couponId:"",couponName:o.couponObj?o.couponObj.name:"",couponSave:o.couponSave,pay:o.pay,status:"paid"};
  orders().push(order);
  if(o.coupon){o.coupon.status="used";o.coupon.useAt=nowStr();o.coupon.orderId=order.id;}
  const oldSpent=+p.totalSpent||0;
  p.totalSpent=Math.round((oldSpent+o.pay)*100)/100;
  if(!(+p.manualLevel>0)){
    const oldAuto=levelBySpent(oldSpent), newAuto=levelBySpent(p.totalSpent);
    if(newAuto>oldAuto){const lv=levelList().find(x=>+x.k===newAuto);memberLogs().push({id:uid("ml"),pid:p.id,patientName:p.patient.name||p.no,oldLevel:oldAuto,newLevel:newAuto,reason:"累计消费 ¥"+(+p.totalSpent).toFixed(2)+" 自动升级",at:nowStr()});toast("恭喜升级为 "+lv.name+" 会员！");}
  }
  save();logOp("患者下单",p.no+" "+p.patient.name+" 实付 ¥"+o.pay.toFixed(2)+" 会员等级"+levelObj(p).name);toast("下单成功，实付 ¥"+o.pay.toFixed(2));renderPatientMember();
}

    +lv.map(x=>'<div class="field"><label>'+esc(x.name)+'：消费门槛（元）</label><input type="number" id="ml_th_'+x.k+'" class="modal-input" value="'+(+x.threshold)+'"><label>折扣率（95=95折，100=无折扣）</label><input type="number" id="ml_dc_'+x.k+'" class="modal-input" value="'+(+x.discount)+'"><label>权益说明</label><input type="text" id="ml_bn_'+x.k+'" class="modal-input" value="'+esc(x.benefit)+'"></div>').join("")
    +'<div class="btn-group"><button class="btn btn-p" onclick="saveMemberRule()">保存</button><button class="btn btn-o" onclick="closeModal()">取消</button></div>');
}
function saveMemberRule(){
  levelList().forEach(x=>{x.threshold=Math.max(0,parseFloat(document.getElementById("ml_th_"+x.k).value)||0);x.discount=Math.min(100,Math.max(0,parseFloat(document.getElementById("ml_dc_"+x.k).value)||100));const bn=document.getElementById("ml_bn_"+x.k).value.trim();if(bn)x.benefit=bn;});
  save();closeModal();toast("等级规则已保存");renderAdminMember();
}
function adjustLevelModal(pid){
  const p=DB.patients.find(x=>x.id===pid);if(!p)return;
  showModal('<h3>调整会员等级：'+esc(p.patient.name||p.no)+'</h3>'
    +'<div class="field"><label>等级</label><select id="al_level" class="modal-input">'
    +levelList().map(x=>'<option value="'+x.k+'"'+(patientLevel(p)===+x.k?" selected":"")+'>'+esc(x.name)+'（'+(+x.discount)+'折）</option>').join("")
    +'<option value="0"'+(+p.manualLevel>0?"":" selected")+'>自动（按消费金额）</option></select></div>'
    +'<div class="btn-group"><button class="btn btn-p" onclick="saveAdjustLevel(\''+p.id+'\')">保存</button><button class="btn btn-o" onclick="closeModal()">取消</button></div>');
}
function saveAdjustLevel(pid){
  const p=DB.patients.find(x=>x.id===pid);if(!p)return;
  const k=parseInt(document.getElementById("al_level").value,10)||0;
  p.manualLevel=k;
  memberLogs().push({id:uid("ml"),pid:p.id,patientName:p.patient.name||p.no,oldLevel:patientLevel(p),newLevel:k>0?k:levelBySpent(p.totalSpent||0),reason:k>0?("管理员手动调整为 "+levelList().find(x=>+x.k===k).name):"恢复自动划级",at:nowStr()});
  save();closeModal();toast("等级已调整");renderAdminMember();
}
/* ---- 转介绍奖励结算 ---- */
function findReferrerByCode(code){if(!code)return null;return DB.users.find(u=>u.username===code)||null;}
function grantRewardCoupon(ownerName,amount,days,note){
  const end=new Date();end.setDate(end.getDate()+(+days||30));
  const cid=uid("cp");
  coupons().push({id:cid,name:"转介绍奖励券",type:"reduce",amount:amount,threshold:0,startDate:dateKeyStr(new Date()),endDate:dateKeyStr(end),total:0,perLimit:0,diffLevel:0,itemIds:[],status:"active",source:"reward",createdAt:nowStr()});
  userCoupons().push({id:uid("uc"),couponId:cid,owner:ownerName,ownerName:ownerName,src:"reward",status:"unused",receiveAt:nowStr(),useAt:"",orderId:"",note:note});
}
function settleReferral(pid,items,ri){
  const p=DB.patients.find(x=>x.id===pid);if(!p)return;
  const code=p.referrerCode||p.sourceRef||"";
  if(!code)return;
  if(rewardSettles().some(s=>s.pid===pid&&s.idx===ri))return;
  const rr=rewardRule();
  const ref=findReferrerByCode(code);
  const itemNames=(items||[]).map(i=>i&&i.name?i.name:i).join("、");
  let rewardType="points",rewardVal=rr.val,detail="";
  if(rr.mode==="coupon"){rewardType="coupon";rewardVal=rr.couponAmount;grantRewardCoupon(code,rr.couponAmount,rr.couponDays,"转介绍奖励（"+(p.patient.name||p.no)+" 完成治疗）");detail="已发放 "+rr.couponAmount+" 元优惠券";}
  else{addPoints(code,rr.val,"转介绍奖励（患者 "+(p.patient.name||p.no)+" 完成第"+(+ri+1)+"次治疗）");detail="已发放 "+rr.val+" 积分";}
  rewardSettles().push({id:uid("rs"),pid:pid,patientName:p.patient.name||p.no,patientNo:p.no,idx:ri,refCode:code,refName:ref?ref.displayName:code,itemName:itemNames||"",rewardType:rewardType,rewardVal:rewardVal,status:"settled",at:nowStr(),detail:detail});
  save();
}
/* ---- 执行人端：我的奖励 ---- */
function renderExecReward(){
  view="exec-reward"; setHeader("执行人端 · 我的奖励","转介绍奖励结算","nurse");
  let h=tabsHtml([
    {k:"home",l:"患者",fn:"renderExecHome()"},
    {k:"remind",l:"提醒("+reminderCount()+")",fn:"showReminderPanel()"},
    {k:"mats",l:"耗材库存",fn:"renderExecMats()"},
    {k:"share",l:"我的分享码",fn:"renderMyShare()"},
    {k:"reward",l:"我的奖励",fn:"renderExecReward()"}
  ],"reward");
  h+='<div class="card no-print" style="margin-bottom:10px;padding:10px 14px"><div class="card-title" style="font-size:.9rem">转介绍奖励：每成功一单自动结算</div></div>';
  const mine=rewardSettles().filter(s=>s.refCode===cur.username).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  const pts=mine.filter(s=>s.rewardType==="points").reduce((s,x)=>s+(+x.rewardVal||0),0);
  const myCoups=userCoupons().filter(x=>x.owner===cur.username&&x.src==="reward");
  h+='<div class="stat-bar"><div class="stat"><b>'+mine.length+'</b><span>结算单数</span></div><div class="stat"><b>'+pts+'</b><span>奖励积分</span></div><div class="stat"><b>'+myCoups.length+'</b><span>奖励券(张)</span></div></div>';
  h+='<div class="card"><div class="card-title">结算明细</div>';
  if(!mine.length)h+='<div class="empty2"><div class="e2-ic">💰</div><div>暂无奖励记录</div><p style="font-size:.8rem;margin-top:6px">分享您的邀请码，被介绍患者完成治疗后自动结算</p></div>';
  else mine.forEach(s=>{h+='<div class="point-item"><span style="flex:1">'+esc(s.patientName||s.patientNo)+' 完成第 '+(+s.idx+1)+' 次治疗<br><span style="color:var(--mu);font-size:.75rem">'+esc(s.itemName)+' · '+esc(s.at)+'</span></span><span class="pv pv-in">'+(s.rewardType==="coupon"?("券 ¥"+(+s.rewardVal)):("+"+s.rewardVal+" 分"))+'</span></div>';});
  h+='</div><div class="card"><div class="card-title">我的奖励券</div>';
  if(!myCoups.length)h+='<div class="empty2"><div class="e2-ic">🎫</div><div>暂无奖励券</div></div>';
  else myCoups.forEach(uc=>{const c=coupons().find(x=>x.id===uc.couponId);h+='<div class="point-item"><span style="flex:1">'+(c?esc(c.name):"奖励券")+'<br><span style="color:var(--mu);font-size:.75rem">'+esc(uc.note||"")+' · '+esc(uc.receiveAt)+'</span></span><span class="pv pv-in">¥'+(c?(+c.amount||0):0)+'</span></div>';});
  h+='</div>';
  container.innerHTML=h;
}

/* ---- 管理员：奖励结算 ---- */
function renderAdminReward(){
  view="admin-reward"; setHeader("管理员端 · 奖励结算","规则配置 · 结算记录 · 统计","admin");
  let h=adminTabs("reward");
  const rr=rewardRule();
  const ss=rewardSettles().sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  const pts=ss.filter(s=>s.rewardType==="points").reduce((s,x)=>s+(+x.rewardVal||0),0);
  const coups=ss.filter(s=>s.rewardType==="coupon").length;
  h+='<div class="stat-bar"><div class="stat"><b>'+ss.length+'</b><span>结算单数</span></div><div class="stat"><b>'+pts+'</b><span>累计积分</span></div><div class="stat"><b>'+coups+'</b><span>奖励券(单)</span></div></div>';
  h+='<div class="card"><div class="card-title">奖励规则</div>'
    +'<div class="rule-row">当前规则：'+(rr.mode==="coupon"?"每单奖励 "+rr.couponAmount+" 元优惠券（有效期 "+rr.couponDays+" 天）":"每单奖励 "+rr.val+" 积分")+'</div>'
    +'<div class="rule-row">说明：被介绍患者每完成一次治疗自动结算一次（同一次治疗不重复）。</div>'
    +'<div class="btn-group"><button class="btn btn-n" onclick="rewardRuleModal()">配置奖励规则</button></div></div>';
  h+='<div class="card"><div class="card-title">结算记录</div>';
  if(!ss.length)h+='<div class="empty2"><div class="e2-ic">📋</div><div>暂无结算记录</div><p style="font-size:.8rem;margin-top:6px">被介绍患者完成治疗后自动生成</p></div>';
  else ss.forEach(s=>{h+='<div class="point-item"><span style="flex:1">'+esc(s.refName||s.refCode)+' 邀请 <b>'+esc(s.patientName||s.patientNo)+'</b> 完成治疗<br><span style="color:var(--mu);font-size:.75rem">'+esc(s.itemName)+' · '+esc(s.at)+'</span></span><span class="pv pv-in">'+(s.rewardType==="coupon"?("券 ¥"+(+s.rewardVal)):("+"+s.rewardVal+" 分"))+'</span></div>';});
  h+='</div>';
  container.innerHTML=h;
}
function rewardRuleModal(){
  const rr=rewardRule();
  showModal('<h3>转介绍奖励规则</h3>'
    +'<div class="field"><label>奖励类型</label><select id="rr_mode" class="modal-input"><option value="points"'+(rr.mode==="points"?" selected":"")+'>积分</option><option value="coupon"'+(rr.mode==="coupon"?" selected":"")+'>优惠券</option></select></div>'
    +'<div class="field"><label>每单奖励积分（模式=积分时生效）</label><input type="number" id="rr_val" class="modal-input" value="'+rr.val+'"></div>'
    +'<div class="field"><label>每单奖励券金额（元，模式=优惠券时生效）</label><input type="number" id="rr_camt" class="modal-input" value="'+rr.couponAmount+'"></div>'
    +'<div class="field"><label>奖励券有效期（天）</label><input type="number" id="rr_cdays" class="modal-input" value="'+rr.couponDays+'"></div>'
    +'<div class="btn-group"><button class="btn btn-p" onclick="saveRewardRule()">保存</button><button class="btn btn-o" onclick="closeModal()">取消</button></div>');
}
function saveRewardRule(){
  const mode=document.getElementById("rr_mode").value;
  const val=Math.max(0,parseInt(document.getElementById("rr_val").value,10)||0);
  const camt=Math.max(1,parseInt(document.getElementById("rr_camt").value,10)||10);
  const cdays=Math.max(1,parseInt(document.getElementById("rr_cdays").value,10)||30);
  DB.settings.rewardRule={mode:mode,val:val,couponAmount:camt,couponDays:cdays,note:mode==="coupon"?("每成功一单奖励 "+camt+" 元优惠券"):("每成功一单奖励 "+val+" 积分")};
  save();closeModal();toast("奖励规则已保存");renderAdminReward();
}
